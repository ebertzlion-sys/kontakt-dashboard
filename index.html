  // ---------- Kalender: Daten ----------
  const DAYS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  const DAYS_LONG = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
  const PRESETS = [
    { label: "Mo–Do abends 18–21 Uhr", win: [1, 2, 3, 4].map((d) => ({ day: d, start: "18:00", end: "21:00" })) },
    { label: "Mo–Fr vormittags 9–12 Uhr", win: [1, 2, 3, 4, 5].map((d) => ({ day: d, start: "09:00", end: "12:00" })) },
    { label: "Mo–Fr nachmittags 14–17 Uhr", win: [1, 2, 3, 4, 5].map((d) => ({ day: d, start: "14:00", end: "17:00" })) },
    { label: "Samstag 10–14 Uhr", win: [{ day: 6, start: "10:00", end: "14:00" }] },
  ];
  const C = {
    tab: "woche", week: new Date(), range: (() => { try { return localStorage.getItem("calRange") || "week"; } catch (e) { return "week"; } })(), loaded: false,
    settings: { avail: [], focus: [], slot_min: 60, weeks: 4, blocked: [] },
    todos: [], bookings: [], members: [], access: [], nextSteps: [], exts: null, extBusy: [], extSyncing: false, nsShare: null, teamSteps: null,
    target: null, targetSettings: null, targetBusy: [], previews: {}, pick: null, channel: null, showDone: false,
  };
  function mondayOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  function weekday(d) { return ((d.getDay() + 6) % 7) + 1; }
  function atTime(d, hhmm) { const [h, m] = hhmm.split(":").map(Number); const x = new Date(d); x.setHours(h, m, 0, 0); return x; }
  function hm(d) { return d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }); }
  function dayLabel(d) { return `${DAYS[weekday(d) - 1]} ${d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}`; }
  function windowsOn(template, d) {
    return (template || []).filter((w) => w.day === weekday(d) && w.start < w.end).map((w) => ({ s: atTime(d, w.start), e: atTime(d, w.end) }))
      .sort((a, b) => a.s - b.s);
  }
  function overlaps(a, b) { return a.s < b.e && b.s < a.e; }
  function subtract(win, busy) {
    let parts = [win];
    for (const b of busy) {
      const next = [];
      for (const p of parts) {
        if (!overlaps(p, b)) { next.push(p); continue; }
        if (b.s > p.s) next.push({ s: p.s, e: b.s });
        if (b.e < p.e) next.push({ s: b.e, e: p.e });
      }
      parts = next;
    }
    return parts.filter((p) => p.e - p.s >= 5 * 60000);
  }
  function ceilQuarter(d) { const x = new Date(d); const m = x.getMinutes(); x.setSeconds(0, 0); if (m % 15) x.setMinutes(m + 15 - (m % 15)); return x; }
  function freeSlots(settings, busy, days) {
    const out = []; const now = new Date(Date.now() + 15 * 60000);
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const len = (settings.slot_min || 60) * 60000;
    for (let i = 0; i < days; i++) {
      const d = addDays(start, i);
      if ((settings.blocked || []).includes(isoDate(d))) continue;
      for (const w of windowsOn(settings.avail, d)) {
        for (let t = w.s.getTime(); t + len <= w.e.getTime(); t += len) {
          const slot = { s: new Date(t), e: new Date(t + len) };
          if (slot.s < now) continue;
          if (busy.some((b) => overlaps(slot, b))) continue;
          out.push(slot);
        }
      }
    }
    return out;
  }
  function myBusy() {
    const b = C.bookings.filter((x) => x.owner === S.me.id).map((x) => ({ s: new Date(x.start_at), e: new Date(x.end_at) }));
    const t = C.todos.filter((x) => !x.done && x.planned_start).map((x) => ({ s: new Date(x.planned_start), e: new Date(new Date(x.planned_start).getTime() + x.duration_min * 60000) }));
    const x = C.extBusy.map((x) => ({ s: new Date(x.start_at), e: new Date(x.end_at) }));
    return b.concat(t, x);
  }
  function settingsRow(row) {
    return {
      avail: Array.isArray(row && row.avail) ? row.avail : [], focus: Array.isArray(row && row.focus) ? row.focus : [],
      slot_min: (row && row.slot_min) || 60, weeks: (row && row.weeks) || 4, blocked: Array.isArray(row && row.blocked) ? row.blocked : [],
    };
  }

  async function loadCal() {
    const me = S.me.id;
    const soon = isoDate(addDays(new Date(), 14));
    const since = addDays(new Date(), -30).toISOString();
    const [st, td, bk, mb, ac, ns] = await Promise.all([
      S.sb.from("cal_settings").select("*").eq("owner", me).maybeSingle(),
      S.sb.from("todos").select("*").eq("owner", me).order("created_at"),
      S.sb.from("bookings").select("*").or(`owner.eq.${me},booker.eq.${me}`).gte("end_at", since).order("start_at"),
      S.sb.rpc("list_members"),
      S.sb.from("cal_access").select("*"),
      S.sb.from("contacts").select("id, name, next_step, next_date").eq("owner", me).not("next_date", "is", null).lte("next_date", soon),
    ]);
    const err = [st, td, bk, mb, ac, ns].find((r) => r.error);
    if (err) { toast("Kalender konnte nicht geladen werden. Ist kalender.sql in Supabase ausgeführt? (" + err.error.message + ")"); }
    C.settings = settingsRow(st.data);
    C.todos = td.data || []; C.bookings = bk.data || []; C.members = mb.data || []; C.access = ac.data || []; C.nextSteps = ns.data || [];
    // iPhone-Kalender (fehlt, solange iphone-kalender.sql noch nicht ausgeführt ist)
    const [ex, eb] = await Promise.all([
      S.sb.from("ext_cal").select("id, name, url, last_sync, last_status, events, pending").eq("owner", me).order("created_at"),
      S.sb.from("ext_busy").select("cal_id, start_at, end_at").eq("owner", me).gte("end_at", addDays(new Date(), -7).toISOString()).order("start_at"),
    ]);
    C.exts = ex.error ? null : ex.data || [];
    // Geteilte Next Steps (fehlt, solange next-steps-teilen.sql noch nicht ausgeführt ist)
    const [nsh, tst] = await Promise.all([S.sb.from("ns_share").select("*"), S.sb.rpc("shared_next_steps", { p_days: 7 })]);
    C.nsShare = nsh.error ? null : nsh.data || [];
    C.teamSteps = tst.error ? null : tst.data || [];
    C.extBusy = eb.error ? [] : eb.data || [];
    C.loaded = true;
    if (!C.channel) {
      let t = null;
      const again = () => { clearTimeout(t); t = setTimeout(async () => { await loadCal(); if (S.view === "cal") renderAll(); }, 400); };
      C.channel = S.sb.channel("cal-" + me)
        .on("postgres_changes", { event: "*", schema: "public", table: "bookings" }, again)
        .on("postgres_changes", { event: "*", schema: "public", table: "todos", filter: "owner=eq." + me }, again)
        .subscribe();
    }
  }
  async function openCal(tab) {
    S.view = "cal"; if (tab) C.tab = tab;
    renderAll();
    await loadCal();
    if (C.tab === "buchen") await loadPreviews();
    renderAll();
  }
  async function saveCalSettings() {
    const { error } = await S.sb.from("cal_settings").upsert({ owner: S.me.id, ...C.settings, updated_at: new Date().toISOString() });
    if (error) toast("Einstellungen nicht gespeichert: " + error.message);
  }
  async function loadTarget(ownerId) {
    const days = 7 * 12;
    const [st, busy] = await Promise.all([
      S.sb.from("cal_settings").select("*").eq("owner", ownerId).maybeSingle(),
      S.sb.rpc("cal_busy", { p_owner: ownerId, p_from: new Date().toISOString(), p_to: addDays(new Date(), days).toISOString() }),
    ]);
    const settings = settingsRow(st.data);
    const b = (busy.data || []).map((x) => ({ s: new Date(x.start_at), e: new Date(x.end_at) }));
    return { settings, busy: b, slots: freeSlots(settings, b, settings.weeks * 7) };
  }
  function sharedWithMe() {
    return C.access.filter((a) => a.viewer === S.me.id).map((a) => ({ id: a.owner, name: (C.members.find((m) => m.id === a.owner) || {}).name || "Unbekannt" }))
      .sort((a, b) => a.name.localeCompare(b.name, "de"));
  }
  async function loadPreviews() {
    const people = sharedWithMe();
    const res = await Promise.all(people.map((p) => loadTarget(p.id)));
    C.previews = {}; people.forEach((p, i) => { C.previews[p.id] = res[i]; });
  }

  // ---------- Kalender: Automatisch einplanen ----------
  async function autoPlan() {
    if (!C.settings.focus.length) { toast("Lege zuerst unter „Einstellungen“ fest, wann du Zeit für To-Dos hast."); C.tab = "einstellungen"; renderAll(); return; }
    const now = new Date();
    const open = C.todos.filter((t) => !t.done && (!t.planned_start || new Date(t.planned_start) < now));
    if (!open.length) { toast("Alle offenen To-Dos sind schon eingeplant."); return; }
    open.sort((a, b) => a.priority - b.priority || (a.due || "9999").localeCompare(b.due || "9999") || a.created_at.localeCompare(b.created_at));
    const busy = myBusy().filter((b) => b.e > now);
    const free = [];
    const start = new Date(); start.setHours(0, 0, 0, 0);
    for (let i = 0; i < C.settings.weeks * 7; i++) {
      const d = addDays(start, i);
      if (C.settings.blocked.includes(isoDate(d))) continue;
      for (const w of windowsOn(C.settings.focus, d)) {
        const s = w.s < now ? ceilQuarter(now) : w.s;
        if (s < w.e) free.push(...subtract({ s, e: w.e }, busy));
      }
    }
    free.sort((a, b) => a.s - b.s);
    const plan = [];
    for (const t of open) {
      const need = t.duration_min * 60000;
      const due = t.due ? new Date(t.due + "T23:59:00") : null;
      let idx = free.findIndex((f) => f.e - f.s >= need && (!due || f.s <= due));
      if (idx < 0) idx = free.findIndex((f) => f.e - f.s >= need);
      if (idx < 0) continue;
      const f = free[idx];
      const s = new Date(f.s), e = new Date(f.s.getTime() + need);
      plan.push({ t, s });
      free.splice(idx, 1, ...(f.e - e >= 5 * 60000 ? [{ s: ceilQuarter(e), e: f.e }] : []));
    }
    if (!plan.length) { toast("In deiner To-Do-Zeit ist gerade kein passender Platz frei. Verlängere die Zeitfenster oder kürze die Dauer."); return; }
    const before = plan.map((p) => [p.t.id, p.t.planned_start]);
    for (const p of plan) {
      p.t.planned_start = p.s.toISOString();
      const { error } = await S.sb.from("todos").update({ planned_start: p.t.planned_start }).eq("id", p.t.id);
      if (error) { toast("Einplanen hat nicht geklappt: " + error.message); break; }
    }
    const missing = open.length - plan.length;
    C.week = plan[0].s;
    renderAll();
    toast(`${plan.length} To-Dos eingeplant${missing ? `, ${missing} passten nicht mehr in deine To-Do-Zeit` : ""}.`, async () => {
      for (const [id, ps] of before) { const t = C.todos.find((x) => x.id === id); if (t) t.planned_start = ps; await S.sb.from("todos").update({ planned_start: ps }).eq("id", id); }
      renderAll();
    });
  }

  // ---------- Kalender: iPhone-Kalender ----------
  function calIcsDownload(events, filename) {
    const pad = (n) => String(n).padStart(2, "0");
    const f = (x) => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
    const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Kontakt-Dashboard//DE", "CALSCALE:GREGORIAN"];
    for (const ev of events) {
      const dOnly = (x) => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}`;
      lines.push("BEGIN:VEVENT", `UID:${ev.uid}@kontakt-dashboard`, `DTSTAMP:${stamp}`, ...(ev.allDay ? [`DTSTART;VALUE=DATE:${dOnly(ev.s)}`, `DTEND;VALUE=DATE:${dOnly(addDays(ev.s, 1))}`] : [`DTSTART:${f(ev.s)}`, `DTEND:${f(ev.e)}`]), `SUMMARY:${icsText(ev.title)}`);
      if (ev.desc) lines.push(`DESCRIPTION:${icsText(ev.desc)}`);
      lines.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Erinnerung", ev.allDay ? "TRIGGER:-P7D" : "TRIGGER:-PT15M", "END:VALARM", "END:VEVENT");
    }
    lines.push("END:VCALENDAR");
    const a = document.createElement("a");
    a.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(lines.map(icsFold).join("\r\n") + "\r\n");
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }
  function serviceToCalendar(id) {
    const c = S.contacts.get(id); const n = c && serviceNext(c); if (!n) return;
    calIcsDownload([{ uid: "service-" + id + "-" + n, s: new Date(n + "T12:00:00"), allDay: true, title: `Service-Termin – ${c.name || "Kunde"}`, desc: [c.beruf, c.info].filter(Boolean).join("\n") }], `Service-${(c.name || "Kunde").replace(/[^\wäöüÄÖÜß-]+/g, "-")}-${n}.ics`);
  }
  function bookingEvent(b) {
    const mineAsOwner = b.owner === S.me.id;
    return { uid: b.id, s: new Date(b.start_at), e: new Date(b.end_at), title: `${b.title} – ${mineAsOwner ? b.booker_name : b.owner_name}`, desc: b.note };
  }
  function todoEvent(t) { const s = new Date(t.planned_start); return { uid: t.id, s, e: new Date(s.getTime() + t.duration_min * 60000), title: "To-Do: " + t.title, desc: "" }; }

  // ---------- Kalender: Darstellung ----------
  function renderCal() {
    const v = $("calView");
    const tabs = [["woche", "Mein Kalender"], ["todos", "To-Dos"], ["buchen", "Zeit buchen"], ["einstellungen", "Einstellungen"]];
    const head = `<div class="cal-tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" data-ctab="${k}" aria-selected="${C.tab === k}">${l}</button>`).join("")}</div>`;
    if (!C.loaded) { v.innerHTML = head + `<div class="empty"><h2>Kalender wird geladen …</h2></div>`; return; }
    let body = "";
    if (C.tab === "woche") body = calWeek();
    else if (C.tab === "todos") body = calTodos();
    else if (C.tab === "buchen") body = calBook();
    else body = calSettingsView();
    v.innerHTML = head + body;
    const td = v.querySelector(".wrow .cday.today");
    if (td) td.parentElement.scrollLeft = Math.max(0, td.offsetLeft - td.parentElement.offsetLeft - 8);
  }
  const RANGES = [["day", "Tag"], ["week", "Woche"], ["2weeks", "2 Wochen"], ["month", "Monat"]];
  function calRange() {
    const a = new Date(C.week); a.setHours(0, 0, 0, 0);
    if (C.range === "day") return { s: a, e: addDays(a, 1) };
    if (C.range === "month") { const s = new Date(a.getFullYear(), a.getMonth(), 1); return { s, e: new Date(a.getFullYear(), a.getMonth() + 1, 1) }; }
    const s = mondayOf(a); return { s, e: addDays(s, C.range === "2weeks" ? 14 : 7) };
  }
  function calShift(dir) {
    const a = new Date(C.week);
    if (C.range === "day") return addDays(a, dir);
    if (C.range === "month") return new Date(a.getFullYear(), a.getMonth() + dir, 1);
    return addDays(a, dir * (C.range === "2weeks" ? 14 : 7));
  }
  function dayItems(d, dn) {
    const items = [];
    for (const b of C.bookings.filter((b) => new Date(b.start_at) >= d && new Date(b.start_at) < dn)) {
      const own = b.owner === S.me.id;
      items.push({ s: new Date(b.start_at), kind: "booking", short: `${hm(new Date(b.start_at))} ${b.title}`, html: `<div class="ci booking"><span class="ct">${hm(new Date(b.start_at))}–${hm(new Date(b.end_at))}</span><div class="cx"><strong>${esc(b.title)}</strong><span>${own ? "gebucht von " + esc(b.booker_name) : "bei " + esc(b.owner_name)}${b.note ? " · " + esc(b.note) : ""}</span></div><div class="ca"><button type="button" class="open-btn" data-bics="${b.id}">Kalender</button><button type="button" class="open-btn" data-bdel="${b.id}">Absagen</button></div></div>` });
    }
    for (const x of C.extBusy) {
      const s = new Date(x.start_at), e = new Date(x.end_at);
      if (!(s < dn && e > d)) continue;
      const whole = s <= d && e >= dn;
      const time = whole ? "ganztägig" : `${hm(s < d ? d : s)}–${e > dn ? "24:00" : hm(e)}`;
      const cal = (C.exts || []).find((c) => c.id === x.cal_id);
      const cname = (cal && cal.name) || "Privat";
      items.push({ s: s < d ? d : s, kind: "private", short: `${whole ? "" : hm(s < d ? d : s) + " "}${cname}`, html: `<div class="ci private"><span class="ct">${time}</span><div class="cx"><strong>${esc(cname)}</strong><span>privater Termin aus deinem iPhone-Kalender</span></div></div>` });
    }
    for (const t of C.todos.filter((t) => t.planned_start && new Date(t.planned_start) >= d && new Date(t.planned_start) < dn)) {
      const s = new Date(t.planned_start), e = new Date(s.getTime() + t.duration_min * 60000);
      items.push({ s, kind: "todo" + (t.done ? " done" : ""), short: `${hm(s)} ${t.title}`, html: `<div class="ci todo ${t.done ? "done" : ""}"><span class="ct">${hm(s)}–${hm(e)}</span><label class="cx"><span class="row-c"><input type="checkbox" data-tdone="${t.id}" ${t.done ? "checked" : ""}> <strong>${esc(t.title)}</strong></span><span>${prioLabel(t.priority)}${t.due ? " · fällig " + fmtDate(t.due) : ""}</span></label><div class="ca"><button type="button" class="open-btn" data-tunplan="${t.id}">Ausplanen</button></div></div>` });
    }
    return items.sort((a, b) => a.s - b.s);
  }
  function isoWeek(d) {
    const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    x.setUTCDate(x.getUTCDate() + 4 - (x.getUTCDay() || 7));
    return Math.ceil(((x - Date.UTC(x.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7);
  }
  function calWeek() {
    const { s: ws, e: we } = calRange(), now = new Date();
    const nDays = Math.round((we - ws) / 86400000);
    const busy = myBusy();
    const allSlots = freeSlots(C.settings, busy, 7 * 12);
    const openTodos = C.todos.filter((t) => !t.done);
    const unplanned = openTodos.filter((t) => !t.planned_start || new Date(t.planned_start) < now);
    const rBookings = C.bookings.filter((b) => new Date(b.start_at) >= ws && new Date(b.start_at) < we);
    const rTodos = C.todos.filter((t) => t.planned_start && new Date(t.planned_start) >= ws && new Date(t.planned_start) < we);
    const rSlots = allSlots.filter((s) => s.s >= ws && s.s < we);
    let focusFree = 0;
    for (let i = 0; i < nDays; i++) {
      const d = addDays(ws, i);
      if (C.settings.blocked.includes(isoDate(d))) continue;
      for (const w of windowsOn(C.settings.focus, d)) for (const p of subtract({ s: w.s < now ? now : w.s, e: w.e }, busy)) if (p.e > p.s) focusFree += (p.e - p.s) / 60000;
    }
    const dueSteps = C.nextSteps.filter((n) => n.next_date < isoDate(we)).length;
    const until = C.range === "day" ? "heute" : "in diesem Zeitraum";
    const tips = [];
    if (!C.settings.avail.length && !C.settings.focus.length) tips.push(`Leg unter <button class="linkbtn" type="button" data-ctab="einstellungen">Einstellungen</button> einmal deine Wochenvorlage fest. Sie gilt dann automatisch für alle kommenden Wochen.`);
    if (unplanned.length) tips.push(`${unplanned.length} ${unplanned.length === 1 ? "To-Do ist" : "To-Dos sind"} noch nicht eingeplant. <button class="btn primary" type="button" data-cact="autoplan">Automatisch einplanen</button>`);
    if (dueSteps) tips.push(`${dueSteps} Next ${dueSteps === 1 ? "Step aus deinen Kontakten ist" : "Steps aus deinen Kontakten sind"} ${until} fällig. <button class="linkbtn" type="button" data-ctab="todos">Als To-Do übernehmen</button>`);
    let grid = "";
    if (C.range === "month") {
      const lead = weekday(ws) - 1, cells = [];
      for (let i = 0; i < lead; i++) cells.push(`<div class="mcell empty" aria-hidden="true"></div>`);
      for (let i = 0; i < nDays; i++) {
        const d = addDays(ws, i), dn = addDays(d, 1);
        const items = dayItems(d, dn);
        const free = rSlots.filter((s) => s.s >= d && s.s < dn).length;
        const isToday = isoDate(d) === isoDate(now), blocked = C.settings.blocked.includes(isoDate(d));
        const shown = items.slice(0, 3);
        cells.push(`<button type="button" class="mcell ${isToday ? "today" : ""} ${d < now && !isToday ? "past" : ""}" data-cday="${isoDate(d)}" aria-label="${DAYS_LONG[weekday(d) - 1]}, ${d.toLocaleDateString("de-DE")}: ${items.length} Einträge">
          <span class="mnum">${d.getDate()}</span>
          ${shown.map((x) => `<span class="mi ${x.kind}">${esc(x.short)}</span>`).join("")}
          ${items.length > 3 ? `<span class="mmore">+${items.length - 3} weitere</span>` : ""}
          ${blocked ? `<span class="mmore">Freier Tag</span>` : free ? `<span class="mfree">${free} frei</span>` : ""}
          <span class="mdots">${items.map((x) => `<i class="${x.kind.split(" ")[0]}"></i>`).join("")}</span>
        </button>`);
      }
      grid = `<div class="mhead">${DAYS.map((d) => `<span>${d}</span>`).join("")}</div><div class="mgrid">${cells.join("")}</div>
        <p class="hint">Tippe auf einen Tag, um ihn in der Tagesansicht zu öffnen.</p>`;
    } else {
      const days = [];
      for (let i = 0; i < nDays; i++) {
        const d = addDays(ws, i), dn = addDays(d, 1);
        const items = dayItems(d, dn);
        const blocked = C.settings.blocked.includes(isoDate(d));
        const ds = rSlots.filter((s) => s.s >= d && s.s < dn);
        const focus = blocked ? [] : windowsOn(C.settings.focus, d);
        const isToday = isoDate(d) === isoDate(now);
        days.push(`<section class="cday ${isToday ? "today" : ""} ${d < now && !isToday ? "past" : ""}">
          <h3>${DAYS_LONG[weekday(d) - 1]} <span>${d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}</span>${isToday ? ` <span class="pill edit">Heute</span>` : ""}</h3>
          ${blocked ? `<p class="hint">Freier Tag</p>` : ""}
          ${items.map((x) => x.html).join("")}
          ${focus.length ? `<p class="cfoot">To-Do-Zeit ${focus.map((w) => `${hm(w.s)}–${hm(w.e)}`).join(", ")}</p>` : ""}
          ${ds.length ? `<p class="cfoot free">Buchbar: ${ds.map((s) => hm(s.s)).join(", ")}</p>` : ""}
          ${!items.length && !focus.length && !ds.length && !blocked ? `<p class="hint">Nichts geplant</p>` : ""}
        </section>`);
      }
      if (C.range === "day") grid = `<div class="cweek one">${days.join("")}</div>`;
      else {
        const rows = [];
        for (let i = 0; i < days.length; i += 7) rows.push(`<div class="wrow-wrap"><p class="wlabel">KW ${isoWeek(addDays(ws, i))}</p><div class="wrow">${days.slice(i, i + 7).join("")}</div></div>`);
        grid = rows.join("");
      }
    }
    const f = { day: "2-digit", month: "2-digit" };
    const label = C.range === "day" ? ws.toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "2-digit", year: "numeric" })
      : C.range === "month" ? ws.toLocaleDateString("de-DE", { month: "long", year: "numeric" })
      : `${ws.toLocaleDateString("de-DE", f)} – ${addDays(we, -1).toLocaleDateString("de-DE", { ...f, year: "numeric" })}`;
    const unit = { day: ["Vorheriger Tag", "Nächster Tag"], week: ["Vorige Woche", "Nächste Woche"], "2weeks": ["Vorige 2 Wochen", "Nächste 2 Wochen"], month: ["Voriger Monat", "Nächster Monat"] }[C.range];
    const isNow = now >= ws && now < we;
    const exportable = rBookings.length + rTodos.filter((t) => !t.done).length;
    return `<div class="cal-bar"><div class="seg" role="group" aria-label="Ansicht">${RANGES.map(([k, l]) => `<button type="button" data-crange="${k}" aria-pressed="${C.range === k}">${l}</button>`).join("")}</div>
        <span class="spacer"></span><button class="btn" type="button" data-cact="weekics" ${exportable ? "" : "disabled"}>In iPhone-Kalender</button><button class="btn primary" type="button" data-cact="autoplan">Automatisch einplanen</button></div>
      <div class="cal-bar"><div class="weeknav"><button class="btn" type="button" data-cweek="-1" aria-label="${unit[0]}">‹</button><strong>${label}</strong><button class="btn" type="button" data-cweek="1" aria-label="${unit[1]}">›</button>${isNow ? "" : `<button class="btn ghost" type="button" data-cweek="0">Heute</button>`}</div></div>
      <div class="cal-sum"><span><strong>${rSlots.length}</strong> buchbare Termine frei</span><span><strong>${(Math.round(focusFree / 6) / 10).toLocaleString("de-DE")} Std.</strong> To-Do-Zeit frei</span><span><strong>${rBookings.length}</strong> ${rBookings.length === 1 ? "Termin" : "Termine"}</span><span><strong>${rTodos.filter((t) => !t.done).length}</strong> To-Dos eingeplant</span></div>
      ${tips.length ? `<div class="tips">${tips.map((t) => `<p>${t}</p>`).join("")}</div>` : ""}
      ${grid}`;
  }
  function prioLabel(p) { return p === 1 ? "Hohe Priorität" : p === 3 ? "Niedrige Priorität" : "Normale Priorität"; }
  function fmtDate(iso) { return new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }); }
  function calTodos() {
    const open = C.todos.filter((t) => !t.done).sort((a, b) => a.priority - b.priority || (a.due || "9999").localeCompare(b.due || "9999"));
    const done = C.todos.filter((t) => t.done);
    const linked = new Set(C.todos.map((t) => t.contact_id).filter(Boolean));
    const sugg = C.nextSteps.filter((n) => n.next_date && !linked.has(n.id)).sort((a, b) => a.next_date.localeCompare(b.next_date));
    const row = (t) => {
      const ps = t.planned_start ? new Date(t.planned_start) : null;
      const late = t.due && !t.done && t.due < isoDate(new Date());
      return `<div class="trow ${t.done ? "done" : ""}"><input type="checkbox" data-tdone="${t.id}" ${t.done ? "checked" : ""} aria-label="Erledigt">
        <input type="text" class="ttitle" data-ttitle="${t.id}" value="${esc(t.title)}" aria-label="To-Do">
        <span class="pill ${t.priority === 1 ? "warn" : ""}">${t.priority === 1 ? "Hoch" : t.priority === 3 ? "Niedrig" : "Normal"}</span>
        <span class="pill">${t.duration_min} Min.</span>
        ${t.due ? `<span class="pill ${late ? "warn" : ""}">fällig ${fmtDate(t.due)}</span>` : ""}
        <span class="pill ${ps && ps > new Date() ? "edit" : ""}">${ps && !t.done ? (ps > new Date() ? `${dayLabel(ps)} ${hm(ps)}` : "Zeit verpasst") : t.done ? "erledigt" : "nicht eingeplant"}</span>
        <button type="button" class="open-btn" data-tdel="${t.id}" aria-label="Löschen">Löschen</button></div>`;
    };
    return `<form id="todoAdd" class="todo-add">
        <input id="tdTitle" type="text" placeholder="Neues To-Do, z. B. Max wegen Analyse anrufen" required aria-label="Neues To-Do">
        <select id="tdDur" aria-label="Dauer"><option value="15">15 Min.</option><option value="30" selected>30 Min.</option><option value="45">45 Min.</option><option value="60">1 Std.</option><option value="90">1,5 Std.</option><option value="120">2 Std.</option></select>
        <select id="tdPrio" aria-label="Priorität"><option value="1">Hoch</option><option value="2" selected>Normal</option><option value="3">Niedrig</option></select>
        <input id="tdDue" type="date" aria-label="Fällig am">
        <button class="btn primary" type="submit">Hinzufügen</button>
      </form>
      <div class="cal-bar"><h3 class="section-title">Offen (${open.length})</h3><span class="spacer"></span><button class="btn primary" type="button" data-cact="autoplan">Automatisch einplanen</button></div>
      <p class="hint">„Automatisch einplanen“ verteilt alle offenen To-Dos nach Priorität und Fälligkeit auf deine To-Do-Zeit der nächsten Wochen. Termine und schon geplante To-Dos bleiben frei.</p>
      <div class="tlist">${open.map(row).join("") || `<p class="hint">Keine offenen To-Dos.</p>`}</div>
      ${sugg.length ? `<h3 class="section-title">Vorschläge aus deinen Kontakten</h3><p class="hint">Next Steps, die in den nächsten 14 Tagen fällig sind oder überfällig.</p>
        <div class="tlist">${sugg.map((n) => `<div class="trow"><span class="ttitle-s"><strong>${esc(n.next_step || "Next Step")}</strong> – ${esc(n.name)}</span><span class="pill ${n.next_date < isoDate(new Date()) ? "warn" : ""}">fällig ${fmtDate(n.next_date)}</span><button type="button" class="btn" data-nsadd="${n.id}">Als To-Do übernehmen</button></div>`).join("")}</div>` : ""}
      ${(() => {
        if (S.owner !== S.me.id) return "";
        const limit = plusMonths(isoDate(new Date()), 1);
        const openTitles = new Set(C.todos.filter((t) => !t.done).map((t) => t.title));
        const svc = [...S.contacts.values()].filter((c) => c.lists.includes("kunden") && serviceNext(c) && serviceNext(c) <= limit && !openTitles.has(`Service-Termin vereinbaren – ${c.name}`))
          .sort((a, b) => serviceNext(a).localeCompare(serviceNext(b)));
        return svc.length ? `<h3 class="section-title">Service-Termine in den nächsten 4 Wochen</h3><div class="tlist">${svc.map((c) => `<div class="trow"><span class="ttitle-s"><strong>Service-Termin</strong> – ${esc(c.name)}</span><span class="pill ${serviceNext(c) < isoDate(new Date()) ? "warn" : ""}">fällig ${fmtDate(serviceNext(c))}</span><button type="button" class="btn" data-svadd="${c._id}">Als To-Do übernehmen</button></div>`).join("")}</div>` : "";
      })()}
      ${done.length ? `<div class="cal-bar"><button class="linkbtn" type="button" data-cact="toggledone">${C.showDone ? "Erledigte ausblenden" : `Erledigte anzeigen (${done.length})`}</button><span class="spacer"></span>${C.showDone ? `<button class="btn ghost" type="button" data-cact="cleardone">Erledigte löschen</button>` : ""}</div>${C.showDone ? `<div class="tlist">${done.map(row).join("")}</div>` : ""}` : ""}`;
  }
  function calBook() {
    const people = sharedWithMe();
    const mine = C.bookings.filter((b) => b.booker === S.me.id && b.owner !== S.me.id && new Date(b.end_at) > new Date());
    let detail = "";
    if (C.target) {
      const p = people.find((x) => x.id === C.target);
      const data = C.previews[C.target];
      if (p && data) {
        const byDay = {};
        for (const s of data.slots) (byDay[isoDate(s.s)] = byDay[isoDate(s.s)] || []).push(s);
        const keys = Object.keys(byDay).sort();
        detail = `<div class="book-detail"><div class="cal-bar"><h3 class="section-title">${esc(p.name)} hat Zeit</h3><span class="spacer"></span><button class="btn ghost" type="button" data-btarget="">Schließen</button></div>
          ${keys.length ? keys.map((k) => `<div class="bday"><strong>${dayLabel(new Date(k + "T12:00:00"))}</strong><div class="slots">${byDay[k].map((s) => `<button type="button" class="slot ${C.pick && C.pick.s.getTime() === s.s.getTime() ? "on" : ""}" data-slot="${s.s.getTime()}|${s.e.getTime()}">${hm(s.s)}</button>`).join("")}</div></div>`).join("")
            : `<p class="hint">${esc(p.name)} hat in den nächsten ${data.settings.weeks} Wochen keine freien Zeiten eingetragen.</p>`}
          ${C.pick ? `<form id="bookForm" class="book-form"><p><strong>${DAYS_LONG[weekday(C.pick.s) - 1]}, ${C.pick.s.toLocaleDateString("de-DE")} · ${hm(C.pick.s)}–${hm(C.pick.e)}</strong> bei ${esc(p.name)}</p>
            <label class="field"><span>Worum geht es?</span><input id="bkTitle" type="text" value="Termin" required></label>
            <label class="field"><span>Notiz (optional)</span><input id="bkNote" type="text" placeholder="z. B. Kundentermin vorbereiten"></label>
            <div><button class="btn primary" type="submit">Verbindlich buchen</button></div></form>` : ""}
        </div>`;
      }
    }
    return `<p class="hint">Hier siehst du, wann Personen Zeit haben, die ihren Kalender für dich freigegeben haben. Tippe auf eine Uhrzeit, um sie zu buchen. Deinen eigenen Kalender gibst du unter „Einstellungen“ frei.</p>
      ${people.length ? `<div class="team-grid">${people.map((p) => {
        const d = C.previews[p.id]; const next = d && d.slots[0];
        return `<button type="button" class="team-card ${C.target === p.id ? "sel" : ""}" data-btarget="${p.id}"><h3>${esc(p.name)} hat Zeit</h3><span>${!d ? "wird geladen …" : next ? `Nächster freier Termin: ${dayLabel(next.s)}, ${hm(next.s)} Uhr · ${d.slots.length} frei` : "Gerade keine freien Zeiten"}</span></button>`;
      }).join("")}</div>` : `<div class="empty"><h2>Noch niemand hat seinen Kalender für dich freigegeben</h2><p>Sobald jemand dich unter „Einstellungen → Wer darf buchen“ auswählt, erscheint die Person hier.</p></div>`}
      ${detail}
      ${mine.length ? `<h3 class="section-title">Deine Buchungen bei anderen</h3><div class="tlist">${mine.map((b) => `<div class="trow"><span class="ttitle-s"><strong>${esc(b.title)}</strong> bei ${esc(b.owner_name)}</span><span class="pill edit">${dayLabel(new Date(b.start_at))} ${hm(new Date(b.start_at))}</span><button type="button" class="open-btn" data-bics="${b.id}">Kalender</button><button type="button" class="open-btn" data-bdel="${b.id}">Absagen</button></div>`).join("")}</div>` : ""}`;
  }
  function winEditor(kind) {
    const list = C.settings[kind];
    return `<div class="presets">${PRESETS.map((p, i) => {
        const on = p.win.every((w) => list.some((x) => x.day === w.day && x.start === w.start && x.end === w.end));
        return `<button type="button" class="chip-toggle" aria-pressed="${on}" data-preset="${kind}|${i}">${p.label}</button>`;
      }).join("")}</div>
      <div class="wins">${list.map((w, i) => `<div class="win"><select data-wday="${kind}|${i}" aria-label="Wochentag">${DAYS_LONG.map((d, j) => `<option value="${j + 1}" ${w.day === j + 1 ? "selected" : ""}>${d}</option>`).join("")}</select>
        <input type="time" data-wstart="${kind}|${i}" value="${w.start}" aria-label="Von"><span>–</span><input type="time" data-wend="${kind}|${i}" value="${w.end}" aria-label="Bis">
        <button type="button" class="x" data-wdel="${kind}|${i}" aria-label="Zeitfenster entfernen" title="Entfernen">×</button></div>`).join("") || `<p class="hint">Noch keine Zeiten. Tippe oben auf einen Vorschlag oder füge ein Zeitfenster hinzu.</p>`}</div>
      <button type="button" class="btn" data-wadd="${kind}">+ Zeitfenster</button>`;
  }
  function calSettingsView() {
    const s = C.settings;
    const others = C.members.filter((m) => m.id !== S.me.id);
    const shared = new Set(C.access.filter((a) => a.owner === S.me.id).map((a) => a.viewer));
    return `<p class="hint">Du legst deine Woche einmal fest. Sie wiederholt sich automatisch jede Woche, du musst nichts neu eintragen. Ausnahmen trägst du unten als freie Tage ein.</p>
      <div class="set-grid">
        <section class="set-card"><h3 class="section-title">Wann können andere dich buchen?</h3><p class="hint">Daraus entsteht „${esc(displayName(S.me))} hat Zeit“ für alle, die du unten freigibst.</p>${winEditor("avail")}</section>
        <section class="set-card"><h3 class="section-title">Wann erledigst du deine To-Dos?</h3><p class="hint">In diese Zeit plant „Automatisch einplanen“ deine To-Dos ein.</p>${winEditor("focus")}</section>
        <section class="set-card"><h3 class="section-title">Termine</h3>
          <div class="grid2"><label class="field"><span>Länge eines Termins</span><select id="setSlot">${[30, 45, 60, 90, 120].map((m) => `<option value="${m}" ${s.slot_min === m ? "selected" : ""}>${m < 60 ? m + " Minuten" : String(m / 60).replace(".", ",") + (m === 60 ? " Stunde" : " Stunden")}</option>`).join("")}</select></label>
          <label class="field"><span>Buchbar im Voraus</span><select id="setWeeks">${[1, 2, 4, 6, 8, 12].map((w) => `<option value="${w}" ${s.weeks === w ? "selected" : ""}>${w} ${w === 1 ? "Woche" : "Wochen"}</option>`).join("")}</select></label></div>
          <h3 class="section-title">Freie Tage</h3><p class="hint">An diesen Tagen bist du nicht buchbar und es werden keine To-Dos eingeplant, zum Beispiel Urlaub.</p>
          <div class="share-row"><input type="date" id="blkDate" aria-label="Freier Tag"><button type="button" class="btn" data-cact="addblock">Hinzufügen</button></div>
          <div class="share-row">${s.blocked.filter((d) => d >= isoDate(new Date())).sort().map((d) => `<span class="share-chip">${new Date(d + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" })}<button type="button" data-blkdel="${d}" aria-label="Entfernen">×</button></span>`).join("") || `<span class="hint">Keine</span>`}</div>
        </section>
        ${extCard()}
        <section class="set-card"><h3 class="section-title">Wer sieht deine Next Steps?</h3>
          ${C.nsShare ? `<p class="hint">Diese Personen sehen deine fälligen und in den nächsten 7 Tagen anstehenden Next Steps auf ihrer Startseite, zum Beispiel deine Führungskraft. Sie sehen nur Name, Next Step und Datum, nicht deine ganze Liste.</p>
          <div class="share-list">${others.map((m) => `<label class="share-item"><input type="checkbox" data-nsshare="${m.id}" ${C.nsShare.some((a) => a.owner === S.me.id && a.viewer === m.id) ? "checked" : ""}> ${esc(m.name)}</label>`).join("") || `<p class="hint">Es gibt noch keine weiteren freigeschalteten Mitglieder.</p>`}</div>`
          : `<p class="hint">Damit du deine Next Steps teilen kannst, muss einmal <strong>next-steps-teilen.sql</strong> in Supabase ausgeführt werden.</p>`}
        </section>
        <section class="set-card"><h3 class="section-title">Wer darf sehen, wann du Zeit hast, und dich buchen?</h3><p class="hint">Diese Personen sehen nur, wann du frei bist, nicht was du vorhast.</p>
          <div class="share-list">${others.map((m) => `<label class="share-item"><input type="checkbox" data-calshare="${m.id}" ${shared.has(m.id) ? "checked" : ""}> ${esc(m.name)}</label>`).join("") || `<p class="hint">Es gibt noch keine weiteren freigeschalteten Mitglieder.</p>`}</div>
        </section>
      </div>`;
  }

  function extCard() {
    const list = C.exts;
    const head = `<section class="set-card"><h3 class="section-title">iPhone-Kalender verbinden</h3>`;
    if (!list) return head + `<p class="hint">Damit private Termine aus deinem iPhone-Kalender deine buchbaren Zeiten automatisch blockieren, muss einmal <strong>iphone-kalender.sql</strong> in Supabase ausgeführt werden.</p></section>`;
    const when = (t) => new Date(t).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    const status = (x) => C.extSyncing ? `<p class="ext-status">Wird abgeglichen …</p>`
      : x.last_status === "ok" ? `<p class="ext-status ok">${x.events} ${x.events === 1 ? "Termin" : "Termine"} in den nächsten 13 Wochen · abgeglichen ${when(x.last_sync)} Uhr</p>`
      : x.last_status ? `<p class="ext-status err">${esc(x.last_status)}</p>`
      : `<p class="ext-status">Der erste Abgleich läuft in den nächsten Minuten.</p>`;
    const steps = `<ol class="ext-steps"><li>Öffne auf dem iPhone die App <strong>Kalender</strong> und tippe unten auf <strong>Kalender</strong>.</li><li>Tippe beim gewünschten Kalender auf das <strong>ⓘ</strong>.</li><li>Schalte <strong>Öffentlicher Kalender</strong> ein und tippe auf <strong>Link teilen → Kopieren</strong>.</li><li>Füge den Link unten ein und tippe auf <strong>Hinzufügen</strong>. Wiederhole das für jeden weiteren Kalender.</li></ol>`;
    return head + `<p class="hint">Termine aus deinen iPhone-Kalendern blockieren automatisch deine buchbaren Zeiten und deine To-Do-Zeit. Gespeichert werden nur Beginn und Ende, keine Titel. Andere sehen nur, dass du belegt bist. Der Abgleich läuft alle 10 Minuten.</p>
      ${list.length ? `<div class="ext-list">${list.map((x) => `<div class="ext-item">
          <div class="ext-row"><input type="text" class="ext-name" data-extname="${x.id}" value="${esc(x.name || "")}" placeholder="Name, z. B. Privat" aria-label="Name des Kalenders" maxlength="60"><button type="button" class="btn ghost" data-extdel="${x.id}">Entfernen</button></div>
          <span class="ext-url" title="${esc(x.url)}">${esc(x.url.replace(/^https:\/\//, ""))}</span>
          ${status(x)}</div>`).join("")}</div>
        <div class="share-row"><button type="button" class="btn" data-cact="extsync" ${C.extSyncing ? "disabled" : ""}>Alle jetzt abgleichen</button></div>
        <details class="ext-more"><summary>Weiteren Kalender hinzufügen</summary>${steps}</details>` : steps}
      <div class="ext-add"><input type="text" id="extName" placeholder="Name, z. B. ${list.length ? "Familie" : "Privat"}" aria-label="Name des neuen Kalenders" maxlength="60">
        <input type="url" id="extUrl" placeholder="webcal://p…-caldav.icloud.com/published/…" aria-label="Kalender-Link" autocomplete="off">
        <button type="button" class="btn primary" data-cact="extadd">Hinzufügen</button></div>
      </section>`;
  }
  async function extSync() {
    C.extSyncing = true; renderAll();
    let r = await S.sb.rpc("ext_sync_mine", { p_start: true });
    for (let i = 0; i < 12 && !r.error && (r.data === "requested" || r.data === "waiting"); i++) {
      await new Promise((ok) => setTimeout(ok, 2500));
      r = await S.sb.rpc("ext_sync_mine", { p_start: false });
    }
    C.extSyncing = false;
    if (r.error) toast("Abgleich fehlgeschlagen: " + r.error.message);
    await loadCal(); renderAll();
    if (!r.error && C.exts && C.exts.length && C.exts.every((x) => x.last_status === "ok")) toast(C.exts.length === 1 ? "iPhone-Kalender abgeglichen." : `${C.exts.length} Kalender abgeglichen.`);
  }

  // ---------- Kalender: Ereignisse ----------
  const calV = $("calView");
  calV.addEventListener("click", async (e) => {
    const t = e.target.closest("button"); if (!t) return;
    const d = t.dataset;
    if (d.ctab) { C.tab = d.ctab; C.pick = null; renderAll(); if (d.ctab === "buchen") { await loadPreviews(); renderAll(); } return; }
    if (d.cweek !== undefined) { C.week = d.cweek === "0" ? new Date() : calShift(Number(d.cweek)); renderAll(); return; }
    if (d.crange) { C.range = d.crange; try { localStorage.setItem("calRange", C.range); } catch (err) { /* egal */ } renderAll(); return; }
    if (d.cday) { C.range = "day"; C.week = new Date(d.cday + "T12:00:00"); renderAll(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    if (d.cact === "autoplan") return autoPlan();
    if (d.cact === "weekics") {
      const { s: ws, e: we } = calRange();
      const ev = C.bookings.filter((b) => new Date(b.start_at) >= ws && new Date(b.start_at) < we).map(bookingEvent)
        .concat(C.todos.filter((x) => !x.done && x.planned_start && new Date(x.planned_start) >= ws && new Date(x.planned_start) < we).map(todoEvent));
      return calIcsDownload(ev, `Woche-${isoDate(ws)}.ics`);
    }
    if (d.cact === "extadd") {
      const url = $("extUrl").value.trim(), name = $("extName").value.trim();
      if (!url) return toast("Füge zuerst den Link aus deinem iPhone-Kalender ein.");
      const { error } = await S.sb.rpc("ext_add", { p_name: name || `Kalender ${(C.exts || []).length + 1}`, p_url: url });
      if (error) return toast(error.message);
      return extSync();
    }
    if (d.extdel) {
      if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.textContent = "Wirklich entfernen?"; t.classList.add("armed"); return; }
      const { error } = await S.sb.rpc("ext_remove", { p_id: d.extdel });
      if (error) return toast(error.message);
      await loadCal(); renderAll(); return toast("Kalender entfernt. Seine Termine blockieren nichts mehr.");
    }
    if (d.cact === "extsync") return extSync();
    if (d.cact === "toggledone") { C.showDone = !C.showDone; renderAll(); return; }
    if (d.cact === "cleardone") {
      const ids = C.todos.filter((x) => x.done).map((x) => x.id);
      const { error } = await S.sb.from("todos").delete().in("id", ids);
      if (error) return toast(error.message);
      C.todos = C.todos.filter((x) => !x.done); renderAll(); return toast(`${ids.length} erledigte To-Dos gelöscht.`);
    }
    if (d.cact === "addblock") {
      const v = $("blkDate").value; if (!v) return toast("Wähle zuerst ein Datum.");
      if (!C.settings.blocked.includes(v)) C.settings.blocked = [...C.settings.blocked, v];
      await saveCalSettings(); renderAll(); return;
    }
    if (d.blkdel) { C.settings.blocked = C.settings.blocked.filter((x) => x !== d.blkdel); await saveCalSettings(); renderAll(); return; }
    if (d.bics) { const b = C.bookings.find((x) => x.id === d.bics); if (b) calIcsDownload([bookingEvent(b)], `Termin-${isoDate(new Date(b.start_at))}.ics`); return; }
    if (d.bdel) {
      if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.textContent = "Wirklich absagen?"; t.classList.add("armed"); return; }
      const { error } = await S.sb.from("bookings").delete().eq("id", d.bdel);
      if (error) return toast(error.message);
      C.bookings = C.bookings.filter((x) => x.id !== d.bdel); renderAll(); return toast("Termin abgesagt.");
    }
    if (d.tunplan) { const x = C.todos.find((y) => y.id === d.tunplan); if (!x) return; x.planned_start = null; renderAll(); await S.sb.from("todos").update({ planned_start: null }).eq("id", x.id); return; }
    if (d.tdel) { const x = C.todos.find((y) => y.id === d.tdel); C.todos = C.todos.filter((y) => y.id !== d.tdel); renderAll(); await S.sb.from("todos").delete().eq("id", d.tdel); return toast(`„${x ? x.title : "To-Do"}“ gelöscht.`); }
    if (d.svadd) {
      const c = S.contacts.get(d.svadd); if (!c) return;
      const due = serviceNext(c) < isoDate(new Date()) ? isoDate(new Date()) : plusMonths(serviceNext(c), 0);
      const { data, error } = await S.sb.from("todos").insert({ owner: S.me.id, title: `Service-Termin vereinbaren – ${c.name}`, due, contact_id: d.svadd, priority: 2, duration_min: 15 }).select().single();
      if (error) return toast(error.message);
      C.todos.push(data); renderAll(); return toast("Als To-Do übernommen.");
    }
    if (d.nsadd) {
      const n = C.nextSteps.find((x) => x.id === d.nsadd); if (!n) return;
      const { data, error } = await S.sb.from("todos").insert({ owner: S.me.id, title: `${n.next_step || "Next Step"} – ${n.name}`, due: n.next_date, contact_id: n.id, priority: n.next_date <= isoDate(new Date()) ? 1 : 2 }).select().single();
      if (error) return toast(error.message);
      C.todos.push(data); renderAll(); return toast("Als To-Do übernommen.");
    }
    if (d.btarget !== undefined) {
      C.target = d.btarget || null; C.pick = null;
      if (C.target) { renderAll(); C.previews[C.target] = await loadTarget(C.target); }
      renderAll(); if (C.target) document.querySelector(".book-detail")?.scrollIntoView({ behavior: "smooth", block: "start" }); return;
    }
    if (d.slot) { const [s, en] = d.slot.split("|").map(Number); C.pick = { s: new Date(s), e: new Date(en) }; renderAll(); document.getElementById("bkTitle")?.focus(); return; }
    if (d.preset) {
      const [kind, i] = d.preset.split("|"); const p = PRESETS[Number(i)];
      const has = (w) => C.settings[kind].some((x) => x.day === w.day && x.start === w.start && x.end === w.end);

    for (const id of ids) {
      const c = S.contacts.get(id);
      let lists = c.lists.includes(target) ? [...c.lists] : [...c.lists, target];
      if (move) lists = lists.filter((l) => l !== S.list);
      c.lists = lists; saveContact(id, 0);
    }
    S.selected.clear();
    renderAll();
    toast(`${ids.length} ${ids.length === 1 ? "Kontakt" : "Kontakte"} ${move ? "in die " + listById(target).label + " verschoben" : "zusätzlich in die " + listById(target).label + " aufgenommen"}.`);
  });
  $("bulk").addEventListener("click", (e) => { if (e.target.id === "bulkClear") { S.selected.clear(); renderAll(); } });

  // ---------- Ereignisse: Verwaltung ----------
  const adminV = $("adminView");
  async function adminDo(promise, ok) {
    const { error } = await promise;
    if (error) toast(error.message.includes("Admin") ? error.message : "Das hat nicht geklappt: " + error.message);
    else if (ok) toast(ok);
    await loadAdmin(); renderAll();
  }
  adminV.addEventListener("click", (e) => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.uactive) {
      const on = t.dataset.to === "true";
      adminDo(S.sb.from("profiles").update({ active: on }).eq("id", t.dataset.uactive), on ? "Konto freigeschaltet." : "Konto gesperrt.");
    }
    if (t.dataset.grevoke) {
      const [owner, viewer] = t.dataset.grevoke.split("|");
      adminDo(S.sb.from("access").delete().eq("owner", owner).eq("viewer", viewer), "Zugriff entfernt.");
    }
  });
  adminV.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.urole) adminDo(S.sb.from("profiles").update({ role: t.value }).eq("id", t.dataset.urole), "Rolle geändert.");
    if (t.dataset.gadd && t.value) adminDo(S.sb.from("access").insert({ owner: t.dataset.gadd, viewer: t.value, can_edit: false }), "Zugriff gegeben (nur lesen).");
    if (t.dataset.gedit) {
      const [owner, viewer] = t.dataset.gedit.split("|");
      adminDo(S.sb.from("access").update({ can_edit: t.value === "1" }).eq("owner", owner).eq("viewer", viewer), "Recht geändert.");
    }
    if (t.dataset.uname) adminDo(S.sb.from("profiles").update({ name: t.value.trim() }).eq("id", t.dataset.uname), "Name gespeichert.");
  });

  // ---------- Ereignisse: Seitenleiste ----------
  const ov = $("overlay");
  ov.addEventListener("input", (e) => {
    if (e.target.dataset.did) return onCellEdit(e);
    if (e.target.id === "impText") {
      importText = e.target.value;
      const p = parseImport(importText);
      $("impGo").disabled = !p.rows.length;
      $("impPrev").innerHTML = importPreview(p);
    }
    if (e.target.dataset.frename) {
      const f = S.fields.find((x) => x.id === e.target.dataset.frename);
      if (f) { f.label = e.target.value; clearTimeout(f._t); f._t = setTimeout(() => { delete f._t; saveSettings(); renderAll(); }, 700); }
    }
  });
  ov.addEventListener("change", async (e) => {
    if (e.target.id === "fType") $("fOptWrap").hidden = e.target.value !== "auswahl";
    if (e.target.id === "impFile" && e.target.files[0]) {
      importText = await e.target.files[0].text();
      $("impText").value = importText;
      const p = parseImport(importText);
      $("impGo").disabled = !p.rows.length;
      $("impPrev").innerHTML = importPreview(p);
    }
    if (e.target.dataset.fscope) {
      const f = S.fields.find((x) => x.id === e.target.dataset.fscope); if (!f) return;
      const checked = [...ov.querySelectorAll(`[data-fscope="${f.id}"]`)].filter((x) => x.checked).map((x) => x.value);
      if (!checked.length) { e.target.checked = true; toast("Ein Feld muss in mindestens einer Liste erscheinen."); return; }
      f.lists = checked.length === LISTS.length ? null : checked;
      saveSettings(); renderTable();
    }
    if (e.target.dataset.did && (e.target.dataset.f === "soziotop" || e.target.dataset.f === "beruf")) renderToolbar();
  });
  ov.addEventListener("submit", (e) => {
    if (e.target.id !== "fAdd") return;
    e.preventDefault();
    const label = $("fLabel").value.trim(); if (!label) return;
    const type = $("fType").value;
    const lists = [...ov.querySelectorAll('input[name="fScope"]')].filter((x) => x.checked).map((x) => x.value);
    if (!lists.length) { toast("Wähle mindestens eine Liste für das Feld."); return; }
    const f = { id: uid8(), label, type, lists: lists.length === LISTS.length ? null : lists };
    if (type === "auswahl") f.options = $("fOpts").value.split(",").map((s) => s.trim()).filter(Boolean);
    S.fields.push(f);
    saveSettings();
    renderPanel(true); renderTable();
    toast(`Feld „${label}“ hinzugefügt.`);
  });
  let armed = null;
  ov.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act], [data-toggle], [data-del], [data-fdel], [data-cal], [data-svcal], #impGo");
    if (!t) return;
    if (t.dataset.cal) return addToCalendar(t.dataset.cal);
    if (t.dataset.svcal) return serviceToCalendar(t.dataset.svcal);
    if (t.dataset.act === "close") return closePanel();
    if (t.id === "impGo") return runImport();
    if (t.dataset.toggle) {
      toggleList(t.dataset.toggle, t.dataset.list);
      const c = S.contacts.get(t.dataset.toggle);
      if (c) ov.querySelectorAll("[data-toggle]").forEach((b) => b.setAttribute("aria-pressed", String(c.lists.includes(b.dataset.list))));
      return;
    }
    if (t.dataset.del || t.dataset.fdel) {
      const key = t.dataset.del || t.dataset.fdel;
      if (armed !== key) {
        armed = key; t.classList.add("armed"); t.textContent = "Wirklich löschen?";
        setTimeout(() => { if (armed === key) { armed = null; if (t.isConnected) { t.classList.remove("armed"); t.textContent = t.dataset.del ? "Kontakt löschen" : "Entfernen"; } } }, 4000);
        return;
      }
      armed = null;
      if (t.dataset.del) {
        const id = key, c = S.contacts.get(id);
        const p = pending.get(id); if (p) { clearTimeout(p.timer); p.dirty = false; pending.delete(id); }
        S.contacts.delete(id); S.selected.delete(id);
        S.sb.from("contacts").delete().eq("id", id).then(({ error }) => { if (error) reportError(error); });
        closePanel();
        toast(`${c && c.name ? c.name : "Kontakt"} gelöscht.`, () => { putContact(id, c); saveContact(id, 0); renderAll(); });
      } else {
        const f = S.fields.find((x) => x.id === key);
        S.fields = S.fields.filter((x) => x.id !== key);
        saveSettings(); renderPanel(true); renderTable();
        toast(`Feld „${f ? f.label : ""}“ entfernt. Die Werte bleiben gespeichert.`, () => { S.fields.push(f); saveSettings(); renderAll(); });
      }
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.panel) closePanel(); });

  // ---------- Start ----------
  if (!window.supabase || !CFG.supabaseUrl || !CFG.supabaseAnonKey || CFG.supabaseUrl.includes("DEIN-PROJEKT")) { showAuth("setup"); return; }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  S.sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") setTimeout(() => showAuth("recover", "Lege jetzt ein neues Passwort fest."), 0);
    else if (event === "SIGNED_IN" && !S.me && S.authMode !== "recover") setTimeout(enter, 0);
  });
  enter();
})();
</script>
</body>
</html>
