<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vertriebs-Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: login card, then sticky header with view switcher and list tabs, spreadsheet table, side drawer for details, fields and import */
:root {
  --bg: #f2f5f6;
  --surface: #ffffff;
  --surface-2: #e9eef0;
  --fg: #13222a;
  --muted: #5a6a72;
  --line: #d3dcdf;
  --accent: #0d5c6b;
  --accent-fg: #ffffff;
  --accent-soft: #dbecef;
  --warn: #9a4f08;
  --warn-soft: #fbe9d4;
  --danger: #b3261e;
  --danger-soft: #fbe2df;
  --l-haupt: #0d5c6b;
  --l-pp: #7a3fa0;
  --l-l30: #a9600b;
  --l-kunden: #2d7a31;
  --shadow: 0 12px 40px rgba(10, 30, 40, .18);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e161a; --surface: #142026; --surface-2: #1b2a31; --fg: #e2ebee; --muted: #93a6ad; --line: #2a3b43;
    --accent: #5cbfcf; --accent-fg: #062429; --accent-soft: #173940;
    --warn: #f0a35a; --warn-soft: #3a2916; --danger: #ff8a80; --danger-soft: #3c1c1a;
    --l-haupt: #5cbfcf; --l-pp: #c69ae6; --l-l30: #f0a35a; --l-kunden: #80cf84;
    --shadow: 0 12px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e161a; --surface: #142026; --surface-2: #1b2a31; --fg: #e2ebee; --muted: #93a6ad; --line: #2a3b43;
  --accent: #5cbfcf; --accent-fg: #062429; --accent-soft: #173940;
  --warn: #f0a35a; --warn-soft: #3a2916; --danger: #ff8a80; --danger-soft: #3c1c1a;
  --l-haupt: #5cbfcf; --l-pp: #c69ae6; --l-l30: #f0a35a; --l-kunden: #80cf84;
  --shadow: 0 12px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: light; }
body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 14px 10px; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand h1 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand small { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 0; }
.tab { --c: var(--accent); display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 10px 12px 11px; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--c); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tab .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 0 7px; font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: var(--radius); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: var(--surface); }
.btn.danger.armed { background: var(--danger); color: var(--surface); }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: .5; cursor: default; }

/* Toolbar */
main { padding-block: 16px 48px; display: flex; flex-direction: column; gap: 12px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar input[type="search"], .toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 7px 10px; min-width: 0; }
.toolbar input[type="search"] { flex: 1 1 220px; }
.chip-toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 500; }
.chip-toggle[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.spacer { flex: 1; }

.bulk[hidden], .btn[hidden] { display: none; }
.bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--accent-soft); border-radius: var(--radius); padding: 8px 12px; }
.bulk select { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 6px 8px; }
.bulk strong { margin-right: 4px; }

/* Table: spreadsheet grid, one row per person, frozen header and name column */
.table-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: calc(100dvh - 250px); }
table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
th, td { text-align: left; vertical-align: middle; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; white-space: nowrap; background: var(--surface); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 7px 8px; background: var(--surface-2); position: sticky; top: 0; z-index: 2; }
th.custom { color: var(--accent); }
.sticky1 { position: sticky; left: 0; z-index: 1; }
.sticky2 { position: sticky; left: 40px; z-index: 1; }
.sticky3 { position: sticky; left: 72px; z-index: 1; box-shadow: 1px 0 0 var(--line), 4px 0 6px -4px rgba(0,0,0,.18); }
th.sticky1, th.sticky2, th.sticky3 { z-index: 3; }
td.rn, th.rn { width: 40px; min-width: 40px; text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--muted); background: var(--surface-2); font-variant-numeric: tabular-nums; padding: 0 4px; }
tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
tbody tr:hover td.rn { background: var(--accent-soft); }
tbody tr.sel td { background: var(--accent-soft); }
td .cell { display: block; width: 100%; height: 32px; border: 0; background: transparent; padding: 0 8px; min-width: 0; text-overflow: ellipsis; }
td .cell:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--surface); position: relative; z-index: 1; }
td input.name { font-weight: 600; }
td select.cell { appearance: auto; }
td.check, th.check { width: 32px; min-width: 32px; text-align: center; padding: 0 6px; }
td.check input, th.check input { width: 15px; height: 15px; vertical-align: middle; }
td.date-c .cell { font-family: var(--font-mono); font-size: 12px; }
.date-wrap { display: flex; align-items: center; }
.date-wrap .cell { flex: 1; }
.cal-btn { border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 6px; font-size: 11px; font-weight: 600; padding: 3px 6px; margin-right: 4px; white-space: nowrap; }
.cal-btn:hover { background: var(--accent-soft); }
.cal-box { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; }
.cal-box .field { flex: 1 1 120px; }
td.date-c.due, tbody tr:hover td.date-c.due { background: var(--warn-soft); }
td.date-c.due .cell { color: var(--warn); font-weight: 600; }
td.svc.soon, tbody tr:hover td.svc.soon { background: var(--warn-soft); }
td.svc.soon .cell { color: var(--warn); font-weight: 600; }
td.svc.late, tbody tr:hover td.svc.late { background: var(--danger-soft); }
td.svc.late .cell { color: var(--danger); font-weight: 600; }
td.bool { text-align: center; padding: 0 8px; }
.lists { display: flex; gap: 3px; padding: 0 6px; flex-wrap: nowrap; }
.lchip { --c: var(--accent); border: 1px solid var(--c); color: var(--c); background: transparent; border-radius: 999px; font-size: 10.5px; font-weight: 600; padding: 1px 7px; font-family: var(--font-mono); min-width: 28px; }
.lchip[aria-pressed="true"] { background: var(--c); color: var(--surface); }
.lchip.wide { font-family: var(--font-body); font-size: 13px; padding: 6px 12px; }
td.act { padding: 0 6px; }
.open-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
.open-btn:hover { background: var(--surface-2); }
.w-name .cell { width: 180px; } .w-soz .cell { width: 130px; } .w-beruf .cell { width: 140px; } .w-info .cell { width: 300px; } .w-ns .cell { width: 200px; } .date-c .cell { width: 128px; } .w-pp .cell { width: 110px; } .w-c .cell { width: 140px; }

.empty { padding: 48px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.empty p { color: var(--muted); max-width: 46ch; margin: 0; }
.empty .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.foot { color: var(--muted); font-size: 12px; max-width: 80ch; }
.foot strong { color: var(--fg); font-weight: 600; }
.status { font-size: 12px; color: var(--muted); }

@media (max-width: 760px) {
  .table-box { max-height: calc(100dvh - 300px); }
  .w-name .cell { width: 140px; }
  .sticky3 { box-shadow: 1px 0 0 var(--line), 4px 0 6px -4px rgba(0,0,0,.25); }
}
/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(5, 15, 20, .45); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); z-index: 21; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-head { display: flex; align-items: center; gap: 8px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-family: var(--font-display); font-size: 19px; margin: 0; margin-right: auto; min-width: 0; overflow-wrap: anywhere; }
.drawer-body { overflow-y: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.drawer-foot { border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 10px; width: 100%; }
.field textarea { min-height: 110px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
.section-title { font-family: var(--font-display); font-size: 15px; margin: 6px 0 0; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.meta { color: var(--muted); font-size: 12px; font-family: var(--font-mono); }
.frow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); }
.frow .scopes { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.frow .type { font-size: 12px; color: var(--muted); }
.frow input[type="text"] { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--surface); width: 100%; }
.scopes label { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; }
textarea.paste { font-family: var(--font-mono); font-size: 12px; min-height: 180px; }
.preview { background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: var(--radius); z-index: 30; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: var(--bg); font-weight: 600; text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* App shell: login card, view switcher, team cards, admin tables */
.auth { min-height: 100dvh; display: grid; place-items: center; padding-block: 32px; }
.auth-card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.auth-card h1 { font-family: var(--font-display); font-size: 24px; margin: 0; }
.auth-card form { display: flex; flex-direction: column; gap: 12px; }
.auth-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.auth-tabs button { border: 0; background: none; padding: 8px 10px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.auth-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.msg { font-size: 13px; border-radius: 6px; padding: 8px 10px; background: var(--accent-soft); }
.msg.err { background: var(--danger-soft); color: var(--danger); }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; text-decoration: underline; text-align: left; }
.views { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
.views { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.views button { white-space: nowrap; border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.views button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--accent-soft); border-radius: var(--radius); padding: 8px 12px; }
.banner strong { font-weight: 600; }
.pill { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.edit { background: var(--accent); color: var(--accent-fg); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.team-card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.team-card:hover { border-color: var(--accent); }
.team-card h3 { font-family: var(--font-display); font-size: 17px; margin: 0; }
.team-card span { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.page-title { font-family: var(--font-display); font-size: 20px; margin: 4px 0 0; }
.admin-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
.admin-box table { width: 100%; min-width: 640px; border-collapse: collapse; }
.admin-box td, .admin-box th { padding: 8px 10px; border-bottom: 1px solid var(--line); border-right: 0; white-space: normal; background: transparent; position: static; }
.admin-box select, .admin-box input[type="text"] { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--surface); }
.share-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.share-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 12.5px; background: var(--surface); }
.share-chip button { border: 0; background: var(--surface-2); border-radius: 999px; width: 22px; height: 22px; line-height: 1; }
td input:disabled, td select:disabled { color: var(--fg); opacity: 1; }
.lchip:disabled { cursor: default; }

/* Kalender */
.cal-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.cal-tabs button { border: 0; background: none; padding: 9px 12px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.cal-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.cal-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.weeknav { display: flex; align-items: center; gap: 8px; }
.weeknav strong { font-variant-numeric: tabular-nums; }
.cal-sum { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 13px; }
.cal-sum strong { color: var(--fg); font-family: var(--font-mono); }
.tips { background: var(--accent-soft); border-radius: var(--radius); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.tips p { margin: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cweek { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.cday { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cday.today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.cday.past { opacity: .6; }
.cweek.one { grid-template-columns: minmax(0, 720px); }
.wrow-wrap { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.wlabel { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); font-family: var(--font-mono); }
.wrow { display: grid; grid-template-columns: repeat(7, minmax(140px, 1fr)); scroll-snap-type: x proximity; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.wrow .cday { padding: 8px; scroll-snap-align: start; }
.wrow .cday h3 { font-size: 14px; flex-wrap: wrap; }
.wrow .ci { grid-template-columns: 1fr; padding: 5px 6px; }
.wrow .ci .ca { grid-column: 1; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.mhead, .mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.mhead span { font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; }
.mcell { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-height: 96px; padding: 6px; display: flex; flex-direction: column; gap: 3px; align-items: stretch; text-align: left; font: inherit; color: inherit; cursor: pointer; min-width: 0; overflow: hidden; }
.mcell.empty { background: transparent; border-color: transparent; cursor: default; }
.mcell.today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.mcell.past { opacity: .6; }
.mcell:hover:not(.empty) { border-color: var(--accent); }
.mnum { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
.mi { font-size: 11.5px; padding: 1px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi.booking { background: var(--accent-soft); }
.mi.todo { background: var(--surface-2); }
.mi.todo.done { text-decoration: line-through; color: var(--muted); }
.mi.private { background: var(--surface-2); border-left: 2px solid var(--muted); }
.mmore { font-size: 11px; color: var(--muted); }
.mfree { font-size: 11px; color: var(--l-kunden); margin-top: auto; }
.mdots { display: none; gap: 3px; flex-wrap: wrap; }
.mdots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.mdots i.booking { background: var(--accent); }
.mdots i.todo { background: var(--warn); }
@media (max-width: 640px) {
  .mcell { min-height: 58px; padding: 4px; }
  .mcell .mi, .mcell .mmore { display: none; }

<script>
(() => {
  // ---------- Konfiguration ----------
  const CFG = window.KONTAKT_CONFIG || {};
  const LISTS = [
    { id: "haupt", label: "Hauptliste", short: "H" },
    { id: "pp", label: "PP-Liste", short: "PP" },
    { id: "l30", label: "30er Liste", short: "30" },
    { id: "kunden", label: "Kundenliste", short: "K" },
  ];
  const TYPES = { text: "Text", zahl: "Zahl", datum: "Datum", auswahl: "Auswahl", janein: "Ja/Nein" };

  const S = {
    sb: null, session: null, me: null,
    view: "list", owner: null, ownerName: "", canEdit: false,
    contacts: new Map(), fields: [], loadedContacts: false, channel: null,
    list: "haupt", q: "", soz: "", sort: "name", dueOnly: false,
    selected: new Set(), panel: null, openId: null,
    team: [], users: [], access: [],
    authMode: "login", authMsg: "", authErr: false,
  };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = () => new Date().toISOString().slice(0, 10);
  const listById = (id) => LISTS.find((l) => l.id === id);
  const uid8 = () => Math.random().toString(36).slice(2, 10);
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (Math.random() * 16) >> (c / 4)).toString(16)));
  const displayName = (p) => (p && (p.name || p.email)) || "Unbekannt";

  try { const s = localStorage.getItem("kd-sort"); if (s) S.sort = s; } catch (e) {}
  $("sort").value = S.sort;

  // ---------- Umrechnung Datenbank <-> Seite ----------
  function fromRow(r) {
    return {
      _id: r.id, name: r.name || "", soziotop: r.soziotop || "", beruf: r.beruf || "", info: r.info || "",
      nextStep: r.next_step || "", nextDate: r.next_date || "", pp: r.pp || "",
      custom: { ...(r.custom || {}) }, lists: Array.isArray(r.lists) && r.lists.length ? [...r.lists] : ["haupt"],
      created: Date.parse(r.created_at) || Date.now(), updated: Date.parse(r.updated_at) || Date.now(),
    };
  }
  function toRow(id, c) {
    return {
      id, owner: S.owner, name: c.name || "", soziotop: c.soziotop || "", beruf: c.beruf || "", info: c.info || "",
      next_step: c.nextStep || "", next_date: c.nextDate || null, pp: c.pp || "",
      custom: c.custom || {}, lists: c.lists && c.lists.length ? c.lists : ["haupt"],
      created_at: new Date(c.created || Date.now()).toISOString(),
    };
  }
  function blank(lists) {
    return { name: "", soziotop: "", beruf: "", info: "", nextStep: "", nextDate: "", pp: "", custom: {}, lists: lists || [S.list], created: Date.now(), updated: Date.now() };
  }

  // ---------- Speichern ----------
  const pending = new Map();
  function saveContact(id, delay = 600) {
    const c = S.contacts.get(id);
    if (!c || !S.canEdit) return;
    c.updated = Date.now();
    let p = pending.get(id);
    if (!p) { p = { timer: null, running: false, dirty: false }; pending.set(id, p); }
    p.dirty = true;
    clearTimeout(p.timer);
    p.timer = setTimeout(() => { p.timer = null; flush(id); }, delay);
    setStatus("Speichert …");
  }
  async function flush(id) {
    const p = pending.get(id);
    if (!p || p.running) return;
    p.running = true;
    while (p.dirty) {
      p.dirty = false;
      const c = S.contacts.get(id);
      if (!c) break;
      const { error } = await S.sb.from("contacts").upsert(toRow(id, c));
      if (error) reportError(error);
    }
    p.running = false;
    if (!p.dirty && p.timer === null) pending.delete(id);
    if (pending.size === 0) setStatus("Alle Änderungen gespeichert.");
  }
  let settingsChain = Promise.resolve();
  function saveSettings() {
    const body = { owner: S.owner, fields: S.fields.map(({ _t, ...f }) => f), updated_at: new Date().toISOString() };
    settingsChain = settingsChain.then(async () => {
      const { error } = await S.sb.from("field_settings").upsert(body);
      if (error) reportError(error);
    });
  }
  function reportError(e) {
    console.error(e);
    const m = (e && e.message) || "";
    if (/row-level security|permission/i.test(m)) toast("Dafür fehlt dir die Berechtigung. Frag den Admin nach Schreibzugriff.");
    else if (/fetch|network/i.test(m)) toast("Keine Verbindung. Deine Änderung bleibt sichtbar, speichere gleich noch einmal.");
    else toast("Speichern hat nicht geklappt: " + m);
    setStatus("");
  }
  function setStatus(t) { $("status").textContent = t; }

  // ---------- Daten einer Liste laden ----------
  async function openOwner(ownerId, name, canEdit) {
    if (S.channel) { S.sb.removeChannel(S.channel); S.channel = null; }
    S.owner = ownerId; S.ownerName = name; S.canEdit = canEdit;
    S.contacts = new Map(); S.fields = []; S.loadedContacts = false; S.selected.clear();
    S.view = "list"; S.list = "haupt"; S.q = ""; S.soz = ""; S.dueOnly = false; $("q").value = "";
    renderAll();
    const [{ data: fs }, rows] = await Promise.all([
      S.sb.from("field_settings").select("fields").eq("owner", ownerId).maybeSingle(),
      fetchAllContacts(ownerId),
    ]);
    if (S.owner !== ownerId) return;
    S.fields = fs && Array.isArray(fs.fields) ? fs.fields : [];
    for (const r of rows) S.contacts.set(r.id, fromRow(r));
    S.loadedContacts = true;
    renderAll();
    S.channel = S.sb.channel("owner-" + ownerId)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "contacts", filter: "owner=eq." + ownerId }, onRemote)
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "contacts", filter: "owner=eq." + ownerId }, onRemote)
      .on("postgres_changes", { event: "DELETE", schema: "public", table: "contacts" }, onRemote)
      .on("postgres_changes", { event: "*", schema: "public", table: "field_settings", filter: "owner=eq." + ownerId }, (pl) => {
        if (S.fields.some((f) => f._t) || !pl.new || !Array.isArray(pl.new.fields)) return;
        if (JSON.stringify(pl.new.fields) === JSON.stringify(S.fields)) return;
        S.fields = pl.new.fields; renderAll();
      })
      .subscribe();
  }
  async function fetchAllContacts(ownerId) {
    const out = []; const step = 1000;
    for (let from = 0; ; from += step) {
      const { data, error } = await S.sb.from("contacts").select("*").eq("owner", ownerId).range(from, from + step - 1);
      if (error) { reportError(error); break; }
      out.push(...data);
      if (data.length < step) break;
    }
    return out;
  }
  function onRemote(pl) {
    const id = (pl.new && pl.new.id) || (pl.old && pl.old.id);
    if (!id || pending.has(id)) return;
    if (pl.eventType === "DELETE") { if (S.contacts.delete(id)) renderAll(); return; }
    const inc = fromRow(pl.new);
    const cur = S.contacts.get(id);
    const strip = (c) => JSON.stringify({ ...c, updated: 0, created: 0 });
    if (cur && strip(cur) === strip(inc)) return;
    S.contacts.set(id, inc); renderAll();
  }

  // ---------- Hilfen für Kontakte ----------
  function fieldsFor(listId) { return S.fields.filter((f) => !f.lists || f.lists.includes(listId)); }
  function fieldsForContact(c) { return S.fields.filter((f) => !f.lists || f.lists.some((l) => (c.lists || []).includes(l))); }
  function isDue(c) { return !!c.nextDate && c.nextDate <= today(); }
  // Service-Termine (nur Kundenliste): liegen in custom._service / custom._serviceNext, damit keine Datenbankänderung nötig ist.
  function plusMonths(iso, n) {
    if (!iso) return "";
    const [y, m, d] = iso.split("-").map(Number);
    const x = new Date(y, m - 1 + n, 1);
    const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
    x.setDate(Math.min(d, last));
    return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
  }
  function serviceNext(c) { return (c.custom || {})._serviceNext || ""; }
  function serviceState(c) {
    const n = serviceNext(c); if (!n) return "";
    if (n < today()) return "late";
    return n <= plusMonths(today(), 1) ? "soon" : "";
  }
  const SERVICE_FIELD = { type: "datum" };
  function getVal(c, key) { return key.startsWith("c:") ? (c.custom || {})[key.slice(2)] : c[key]; }
  function setVal(c, key, v) { if (key.startsWith("c:")) c.custom = { ...(c.custom || {}), [key.slice(2)]: v }; else c[key] = v; }
  function inList(listId) { return [...S.contacts.values()].filter((c) => (c.lists || []).includes(listId)); }
  function visibleRows() {
    const q = S.q.trim().toLowerCase();
    let rows = inList(S.list);
    if (S.soz) rows = rows.filter((c) => (c.soziotop || "") === S.soz);
    if (S.dueOnly) rows = rows.filter(isDue);
    if (q) rows = rows.filter((c) => [c.name, c.soziotop, c.beruf, c.info, c.nextStep, ...Object.values(c.custom || {})].join(" ").toLowerCase().includes(q));
    const by = {
      name: (a, b) => (a.name || "").localeCompare(b.name || "", "de", { sensitivity: "base" }),
      next: (a, b) => (a.nextDate || "9999").localeCompare(b.nextDate || "9999") || by.name(a, b),
      updated: (a, b) => (b.updated || 0) - (a.updated || 0),
      created: (a, b) => (b.created || 0) - (a.created || 0),
    };
    return rows.sort(by[S.sort] || by.name);
  }
  function putContact(id, c) { c._id = id; S.contacts.set(id, c); }
  function toggleList(id, listId) {
    if (!S.canEdit) return;
    const c = S.contacts.get(id);
    if (!c) return;
    const has = c.lists.includes(listId);
    if (has && c.lists.length === 1) { toast("Ein Kontakt braucht mindestens eine Liste. Zum Löschen den Kontakt öffnen."); return; }
    const before = [...c.lists];
    c.lists = has ? c.lists.filter((l) => l !== listId) : [...c.lists, listId];
    saveContact(id, 0);
    renderAll();
    toast(`${c.name || "Kontakt"} ${has ? "aus " + listById(listId).label + " entfernt" : "zur " + listById(listId).label + " hinzugefügt"}.`, () => {
      const cc = S.contacts.get(id); if (!cc) return; cc.lists = before; saveContact(id, 0); renderAll();
    });
  }

  // ---------- Anmeldung ----------
  function renderAuth() {
    const m = S.authMode;
    const msg = S.authMsg ? `<div class="msg ${S.authErr ? "err" : ""}" role="status">${esc(S.authMsg)}</div>` : "";
    let form = "";
    if (m === "login") form = `<form id="fLogin">
        <label class="field"><span>E-Mail</span><input id="aEmail" type="email" autocomplete="username" required></label>
        <label class="field"><span>Passwort</span><input id="aPass" type="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit">Anmelden</button>
        <button class="linkbtn" type="button" data-mode="forgot">Passwort vergessen?</button></form>`;
    else if (m === "signup") form = `<form id="fSignup">
        <label class="field"><span>Dein Name</span><input id="aName" type="text" autocomplete="name" required></label>
        <label class="field"><span>E-Mail</span><input id="aEmail" type="email" autocomplete="username" required></label>
        <label class="field"><span>Passwort (mindestens 8 Zeichen)</span><input id="aPass" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn primary" type="submit">Konto anlegen</button>
        <p class="hint">Nach der Registrierung schaltet der Admin dein Konto frei.</p></form>`;
    else if (m === "forgot") form = `<form id="fForgot">
        <label class="field"><span>E-Mail</span><input id="aEmail" type="email" autocomplete="username" required></label>
        <button class="btn primary" type="submit">Link zum Zurücksetzen senden</button>
        <button class="linkbtn" type="button" data-mode="login">Zurück zur Anmeldung</button></form>`;
    else if (m === "recover") form = `<form id="fRecover">
        <label class="field"><span>Neues Passwort (mindestens 8 Zeichen)</span><input id="aPass" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn primary" type="submit">Passwort speichern</button></form>`;
    else if (m === "pending") form = `<p>Hallo ${esc(displayName(S.me))}, dein Konto ist angelegt und wartet auf die Freischaltung durch den Admin. Sobald das passiert ist, lade diese Seite neu.</p>
        <button class="btn" type="button" id="btnLogout2">Abmelden</button>`;
    else if (m === "setup") form = `<p>Diese Seite ist noch nicht mit der Datenbank verbunden. Trage in <code>config.js</code> die Supabase-Adresse und den öffentlichen Schlüssel ein.</p>`;
    const tabs = m === "login" || m === "signup" ? `<div class="auth-tabs" role="tablist"><button type="button" role="tab" data-mode="login" aria-selected="${m === "login"}">Anmelden</button><button type="button" role="tab" data-mode="signup" aria-selected="${m === "signup"}">Registrieren</button></div>` : "";
    $("authView").innerHTML = `<div class="auth-card"><h1>Vertriebs-Cockpit</h1>${tabs}${msg}${form}</div>`;
    const f = $("authView").querySelector("input"); if (f) f.focus();
  }
  function showAuth(mode, msg, err) {
    S.authMode = mode; S.authMsg = msg || ""; S.authErr = !!err;
    $("appView").hidden = true; $("authView").hidden = false;
    renderAuth();
  }
  $("authView").addEventListener("click", async (e) => {
    const t = e.target.closest("[data-mode], #btnLogout2"); if (!t) return;
    if (t.id === "btnLogout2") return logout();
    showAuth(t.dataset.mode);
  });
  $("authView").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
    const email = $("aEmail") ? $("aEmail").value.trim() : "", pass = $("aPass") ? $("aPass").value : "";
    let res;
    if (e.target.id === "fLogin") {
      res = await S.sb.auth.signInWithPassword({ email, password: pass });
      if (res.error) showAuth("login", res.error.message === "Invalid login credentials" ? "E-Mail oder Passwort stimmt nicht." : res.error.message, true);
    } else if (e.target.id === "fSignup") {
      res = await S.sb.auth.signUp({ email, password: pass, options: { data: { name: $("aName").value.trim() }, emailRedirectTo: location.origin + location.pathname } });
      if (res.error) showAuth("signup", res.error.message, true);
      else if (!res.data.session) showAuth("login", "Fast geschafft: Bestätige deine E-Mail-Adresse über den Link in der Mail und melde dich dann hier an.");
    } else if (e.target.id === "fForgot") {
      res = await S.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      showAuth("login", res.error ? res.error.message : "Wenn ein Konto zu dieser Adresse existiert, ist eine Mail mit einem Link unterwegs.", !!res.error);
    } else if (e.target.id === "fRecover") {
      res = await S.sb.auth.updateUser({ password: pass });
      if (res.error) showAuth("recover", res.error.message, true);
      else { S.authMode = "login"; await enter(); toast("Neues Passwort gespeichert."); }
    }
    if (btn.isConnected) btn.disabled = false;
  });
  async function logout() {
    if (S.channel) { S.sb.removeChannel(S.channel); S.channel = null; }
    if (C.channel) { S.sb.removeChannel(C.channel); C.channel = null; C.loaded = false; }
    await S.sb.auth.signOut();
    S.me = null; S.owner = null; S.contacts = new Map();
    showAuth("login", "Du bist abgemeldet.");
  }
  $("btnLogout").addEventListener("click", logout);

  let entering = null;
  function enter() { if (!entering) entering = doEnter().finally(() => { entering = null; }); return entering; }
  async function doEnter() {
    const { data: { session } } = await S.sb.auth.getSession();
    S.session = session;
    if (!session) return showAuth("login");
    const { data: me, error } = await S.sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    if (error || !me) return showAuth("login", "Dein Profil konnte nicht geladen werden. Versuche es gleich noch einmal.", true);
    S.me = me;
    if (!me.active) return showAuth("pending");
    $("authView").hidden = true; $("appView").hidden = false;
    $("whoName").textContent = displayName(me) + (me.role === "admin" ? " · Admin" : "");
    await loadTeam();
    const h = location.hash.slice(1);
    if (h === "kalender") { await openOwner(me.id, displayName(me), true); await openCal(); }
    else if (h === "team") { await openOwner(me.id, displayName(me), true); S.view = "team"; renderAll(); }
    else if (h === "verwaltung" && me.role === "admin") { await openOwner(me.id, displayName(me), true); await showAdmin(); }
    else if (h === "liste") await openOwner(me.id, displayName(me), true);
    else await openHome();
  }

  // ---------- Team und Verwaltung laden ----------
  async function loadTeam() {
    const { data, error } = await S.sb.from("access").select("owner, can_edit, profiles!access_owner_fkey(id, name, email)").eq("viewer", S.me.id);
    S.team = error ? [] : data.filter((r) => r.profiles).map((r) => ({ id: r.owner, name: displayName(r.profiles), email: r.profiles.email, canEdit: r.can_edit }));
    S.team.sort((a, b) => a.name.localeCompare(b.name, "de"));
  }
  async function loadAdmin() {
    const [u, a] = await Promise.all([
      S.sb.from("profiles").select("*").order("created_at"),
      S.sb.from("access").select("*"),
    ]);
    S.users = u.data || []; S.access = a.data || [];
  }
  async function showAdmin() { S.view = "admin"; await loadAdmin(); renderAll(); }

  // ---------- Darstellung ----------
  function renderViews() {
    const isMine = S.owner === S.me.id;
    const b = (v, label) => `<button type="button" data-view="${v}" aria-pressed="${S.view === v && (v !== "list" || isMine)}">${label}</button>`;
    $("views").innerHTML = b("home", "Start") + b("list", "Meine Liste") + b("cal", "Kalender") + b("team", `Team${S.team.length ? " (" + S.team.length + ")" : ""}`) + (S.me.role === "admin" ? b("admin", "Verwaltung") : "");
    $("listView").hidden = S.view !== "list";
    $("homeView").hidden = S.view !== "home";
    $("teamView").hidden = S.view !== "team";
    $("adminView").hidden = S.view !== "admin";
    $("calView").hidden = S.view !== "cal";
    $("tabs").hidden = S.view !== "list";
  }
  function renderTabs() {
    $("tabs").innerHTML = LISTS.map((l) => `<button class="tab" role="tab" type="button" data-list="${l.id}" aria-selected="${l.id === S.list}" style="--c: var(--l-${l.id})"><span class="dot"></span>${esc(l.label)}<span class="n">${S.loadedContacts ? inList(l.id).length : "–"}</span></button>`).join("");
    const all = S.contacts.size, due = [...S.contacts.values()].filter(isDue).length;
    const whose = S.owner === S.me.id ? "Deine Liste" : "Liste von " + S.ownerName;
    $("summary").textContent = S.view === "team" ? "Listen, die mit dir geteilt sind" : S.view === "admin" ? "Konten und Freigaben" : S.view === "cal" ? "To-Dos, Wochenplanung und Termine" : S.view === "home" ? "Das Wichtigste auf einen Blick" : !S.loadedContacts ? "Kontakte werden geladen …" :
      `${whose} · ${all} ${all === 1 ? "Kontakt" : "Kontakte"} · ${due} ${due === 1 ? "Next Step fällig" : "Next Steps fällig"}`;
  }
  function renderToolbar() {
    const socs = [...new Set([...S.contacts.values()].map((c) => (c.soziotop || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
    const berufe = [...new Set([...S.contacts.values()].map((c) => (c.beruf || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
    if (S.soz && !socs.includes(S.soz)) S.soz = "";
    $("soz").innerHTML = `<option value="">Alle Soziotope</option>` + socs.map((s) => `<option ${s === S.soz ? "selected" : ""}>${esc(s)}</option>`).join("");
    $("dl-soz").innerHTML = socs.map((s) => `<option value="${esc(s)}"></option>`).join("");
    $("dl-beruf").innerHTML = berufe.map((s) => `<option value="${esc(s)}"></option>`).join("");
    const due = inList(S.list).filter(isDue).length;
    $("dueOnly").textContent = `Fällig: ${due}`;
    $("dueOnly").setAttribute("aria-pressed", String(S.dueOnly));
    for (const b of ["btnAdd", "btnImport", "btnFields"]) { $(b).hidden = !S.canEdit; $(b).disabled = !S.loadedContacts; }
    const mine = S.owner === S.me.id;
    const ob = $("ownerBanner");
    ob.hidden = mine;
    if (!mine) ob.innerHTML = `<button class="btn" type="button" data-view="team">← Team</button><span>Du siehst die Liste von <strong>${esc(S.ownerName)}</strong>.</span><span class="pill ${S.canEdit ? "edit" : ""}">${S.canEdit ? "Darf bearbeiten" : "Nur lesen"}</span>`;
  }
  function renderBulk() {
    const ids = [...S.selected].filter((id) => S.contacts.has(id));
    const box = $("bulk");
    box.hidden = ids.length === 0 || !S.canEdit;
    if (box.hidden) { box.innerHTML = ""; return; }
    const opts = LISTS.filter((l) => l.id !== S.list).map((l) => `<option value="${l.id}">${esc(l.label)}</option>`).join("");
    box.innerHTML = `<strong>${ids.length} ausgewählt</strong>
      <select id="bulkAdd" aria-label="Zusätzlich in Liste aufnehmen"><option value="">Auch aufnehmen in …</option>${opts}</select>
      <select id="bulkMove" aria-label="In andere Liste verschieben"><option value="">Verschieben nach …</option>${opts}</select>
      <button class="btn ghost" type="button" id="bulkClear">Auswahl aufheben</button>`;
  }
  function cellInput(c, id, key, field) {
    const v = getVal(c, key);
    const a = `data-id="${id}" data-f="${esc(key)}" ${S.canEdit ? "" : "disabled"}`;
    if (field && field.type === "zahl") return `<input class="cell" type="number" ${a} value="${esc(v ?? "")}">`;
    if (field && field.type === "datum") return `<input class="cell" type="date" ${a} value="${esc(v ?? "")}">`;
    if (field && field.type === "auswahl") return `<select class="cell" ${a}><option value=""></option>${(field.options || []).map((o) => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    if (field && field.type === "janein") return `<input type="checkbox" ${a} ${v ? "checked" : ""} aria-label="${esc(field.label)}">`;
    const extra = key === "name" ? ' class="cell name" placeholder="Name"' : key === "soziotop" ? ' class="cell" list="dl-soz"' : key === "beruf" ? ' class="cell" list="dl-beruf"' : ' class="cell"';
    return `<input type="text"${extra} ${a} value="${esc(v ?? "")}" title="${esc(v ?? "")}">`;
  }
  function renderTable() {
    const box = $("tableBox");
    if (!S.loadedContacts) { box.innerHTML = `<div class="empty"><h2>Kontakte werden geladen …</h2><p>Hier erscheint gleich die Liste mit Name, Soziotop, Beruf, Informationen und Next Step.</p></div>`; return; }
    const rows = visibleRows();
    const custom = fieldsFor(S.list);
    const label = listById(S.list).label;
    if (!rows.length) {
      const noneInList = inList(S.list).length === 0;
      const actions = S.canEdit ? `<div class="row"><button class="btn primary" type="button" data-act="add">+ Kontakt anlegen</button><button class="btn" type="button" data-act="import">Liste einfügen</button></div>` : "";
      box.innerHTML = noneInList
        ? `<div class="empty"><h2>${esc(label)} ist noch leer</h2><p>${!S.canEdit ? "In dieser Liste stehen noch keine Kontakte." : S.contacts.size === 0 ? "Leg deinen ersten Kontakt an oder füge deine bestehende Liste aus Excel ein." : "Leg hier einen Kontakt an oder nimm Kontakte aus einer anderen Liste über die Listen-Knöpfe in jeder Zeile auf."}</p>${actions}</div>`
        : `<div class="empty"><h2>Keine Treffer</h2><p>Kein Kontakt in der ${esc(label)} passt zu Suche oder Filter.</p><div class="row"><button class="btn" type="button" data-act="reset">Filter zurücksetzen</button></div></div>`;
      return;
    }
    const allSel = rows.every((c) => S.selected.has(c._id));
    const head = `<tr><th class="rn sticky1">#</th><th class="check sticky2"><input type="checkbox" id="selAll" ${allSel ? "checked" : ""} aria-label="Alle auswählen"></th>
      <th class="sticky3">Name</th><th>Listen</th><th>Soziotop</th><th>Beruf</th><th>Informationen</th><th>Next Step</th><th>Fällig am</th>
      ${S.list === "kunden" ? `<th class="custom">Service-Termin</th><th class="custom" title="Wird automatisch ein halbes Jahr nach dem Service-Termin eingetragen">Nächster Service</th>` : ""}
      ${custom.map((f) => `<th class="custom" title="Eigenes Feld">${esc(f.label)}</th>`).join("")}
      <th></th></tr>`;
    const dis = S.canEdit ? "" : "disabled";
    const body = rows.map((c, i) => {
      const id = c._id;
      return `<tr class="${S.selected.has(id) ? "sel" : ""}" data-row="${id}">
        <td class="rn sticky1">${i + 1}</td>
        <td class="check sticky2"><input type="checkbox" data-sel="${id}" ${S.selected.has(id) ? "checked" : ""} aria-label="Auswählen"></td>
        <td class="w-name sticky3">${cellInput(c, id, "name")}</td>
        <td><div class="lists">${LISTS.map((l) => `<button type="button" class="lchip" style="--c: var(--l-${l.id})" data-toggle="${id}" data-list="${l.id}" aria-pressed="${c.lists.includes(l.id)}" title="${esc(l.label)}" ${dis}>${l.short}</button>`).join("")}</div></td>
        <td class="w-soz">${cellInput(c, id, "soziotop")}</td>
        <td class="w-beruf">${cellInput(c, id, "beruf")}</td>
        <td class="w-info">${cellInput(c, id, "info")}</td>
        <td class="w-ns">${cellInput(c, id, "nextStep")}</td>
        <td class="date-c ${isDue(c) ? "due" : ""}"><div class="date-wrap"><input class="cell" type="date" data-id="${id}" data-f="nextDate" value="${esc(c.nextDate || "")}" aria-label="Fällig am" ${dis}><button type="button" class="cal-btn" data-cal="${id}" title="In den Kalender eintragen" ${c.nextDate ? "" : "hidden"}>Kalender</button></div></td>
        ${S.list === "kunden" ? `<td class="w-c date-c">${cellInput(c, id, "c:_service", SERVICE_FIELD)}</td><td class="w-c date-c svc ${serviceState(c)}">${cellInput(c, id, "c:_serviceNext", SERVICE_FIELD)}</td>` : ""}
        ${custom.map((f) => `<td class="w-c ${f.type === "janein" ? "bool" : ""} ${f.type === "datum" ? "date-c" : ""}">${cellInput(c, id, "c:" + f.id, f)}</td>`).join("")}
        <td class="act"><button type="button" class="open-btn" data-open="${id}" title="Alle Angaben ansehen">Öffnen</button></td>
      </tr>`;
    }).join("");
    box.innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
  }
  function renderTeam() {
    const v = $("teamView");
    v.innerHTML = `<h2 class="page-title">Team</h2>
      <p class="hint">Hier stehen die Listen anderer, auf die du Zugriff hast. Freigaben richtet der Admin unter „Verwaltung“ ein.</p>
      ${S.team.length ? `<div class="team-grid">${S.team.map((t) => `<button type="button" class="team-card" data-owner="${t.id}"><h3>${esc(t.name)}</h3><span>${esc(t.email)}</span><span class="pill ${t.canEdit ? "edit" : ""}" style="align-self:flex-start">${t.canEdit ? "Darf bearbeiten" : "Nur lesen"}</span></button>`).join("")}</div>`
        : `<div class="empty"><h2>Noch keine geteilten Listen</h2><p>Sobald der Admin dir Zugriff auf die Liste einer anderen Person gibt, erscheint sie hier.</p></div>`}`;
  }
  function renderAdmin() {
    const v = $("adminView");
    const byId = Object.fromEntries(S.users.map((u) => [u.id, u]));
    const waiting = S.users.filter((u) => !u.active).length;
    const users = S.users.map((u) => `<tr>
        <td><input type="text" data-uname="${u.id}" value="${esc(u.name)}" aria-label="Name"></td>
        <td style="overflow-wrap:anywhere">${esc(u.email)}</td>
        <td><select data-urole="${u.id}" ${u.id === S.me.id ? "disabled" : ""}><option value="user" ${u.role === "user" ? "selected" : ""}>Mitglied</option><option value="admin" ${u.role === "admin" ? "selected" : ""}>Admin</option></select></td>
        <td>${u.id === S.me.id ? `<span class="pill edit">Aktiv (du)</span>` : `<button type="button" class="btn ${u.active ? "" : "primary"}" data-uactive="${u.id}" data-to="${!u.active}">${u.active ? "Sperren" : "Freischalten"}</button>`}</td>
        <td class="meta">${new Date(u.created_at).toLocaleDateString("de-DE")}</td></tr>`).join("");
    const shares = S.users.filter((u) => u.active).map((o) => {
      const grants = S.access.filter((a) => a.owner === o.id);
      const free = S.users.filter((u) => u.id !== o.id && u.active && !grants.some((g) => g.viewer === u.id));
      return `<tr><td><strong>${esc(displayName(o))}</strong></td><td><div class="share-row">
          ${grants.map((g) => `<span class="share-chip">${esc(displayName(byId[g.viewer]))} · <select data-gedit="${o.id}|${g.viewer}" aria-label="Recht"><option value="0" ${g.can_edit ? "" : "selected"}>liest</option><option value="1" ${g.can_edit ? "selected" : ""}>bearbeitet</option></select><button type="button" data-grevoke="${o.id}|${g.viewer}" aria-label="Zugriff entfernen" title="Zugriff entfernen">×</button></span>`).join("") || `<span class="hint">Niemand außer ${esc(displayName(o))}</span>`}
          ${free.length ? `<select data-gadd="${o.id}" aria-label="Zugriff geben"><option value="">+ Zugriff geben …</option>${free.map((u) => `<option value="${u.id}">${esc(displayName(u))}</option>`).join("")}</select>` : ""}
        </div></td></tr>`;
    }).join("");
    v.innerHTML = `<h2 class="page-title">Verwaltung</h2>
      <p class="hint">Neue Personen registrieren sich selbst auf der Anmeldeseite und erscheinen hier mit „Freischalten“. Gesperrte Konten können sich anmelden, sehen aber nichts. Ein Konto ganz löschen kannst du im Supabase-Dashboard unter Authentication → Users.</p>
      <h3 class="section-title">Konten ${waiting ? `<span class="pill warn">${waiting} warten auf Freischaltung</span>` : ""}</h3>
      <div class="admin-box"><table><thead><tr><th>Name</th><th>E-Mail</th><th>Rolle</th><th>Status</th><th>Seit</th></tr></thead><tbody>${users}</tbody></table></div>
      <h3 class="section-title">Wer sieht welche Liste</h3>
      <p class="hint">Jede Zeile ist die Liste einer Person. Wer dort eingetragen ist, findet sie unter „Team“. „liest“ heißt nur ansehen, „bearbeitet“ heißt auch ändern.</p>
      <div class="admin-box"><table><thead><tr><th>Liste von</th><th>Zugriff haben</th></tr></thead><tbody>${shares}</tbody></table></div>`;
  }
  function renderAll() {
    if (!S.me) return;
    const a = document.activeElement;
    const keep = a && a.dataset && a.dataset.f && a.closest("#tableBox") ? { id: a.dataset.id, f: a.dataset.f, s: a.selectionStart, e: a.selectionEnd } : null;
    renderViews(); renderTabs();
    if (S.view === "list") { renderToolbar(); renderBulk(); renderTable(); }
    else if (S.view === "team") renderTeam();
    else if (S.view === "admin") renderAdmin();
    else if (S.view === "cal") renderCal();
    else if (S.view === "home") renderHome();
    if (keep) {
      const el = document.querySelector(`#tableBox [data-id="${keep.id}"][data-f="${CSS.escape(keep.f)}"]`);
      if (el) { el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) {} }
    }
    if (S.panel) renderPanel();
  }

  // ---------- Seitenleiste ----------
  function openPanel(kind, id) { S.panel = kind; S.openId = id || null; renderPanel(true); }
  function closePanel() { S.panel = null; S.openId = null; $("overlay").innerHTML = ""; renderAll(); }
  function renderPanel(fresh) {
    const host = $("overlay");
    if (!fresh && host.querySelector(".drawer") && host.contains(document.activeElement)) return;
    if (!fresh && S.panel === "contact" && !S.contacts.has(S.openId)) { closePanel(); return; }
    let html = "";
    if (S.panel === "contact") html = contactPanel();
    else if (S.panel === "fields") html = fieldsPanel();
    else if (S.panel === "import") html = importPanel();
    else { host.innerHTML = ""; return; }
    const scroll = host.querySelector(".drawer-body")?.scrollTop || 0;
    host.innerHTML = `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true">${html}</aside>`;
    const body = host.querySelector(".drawer-body"); if (body && !fresh) body.scrollTop = scroll;
    if (fresh) { const f = host.querySelector("[data-autofocus]"); if (f) f.focus(); }
  }
  function dField(c, id, key, label, field, attrs = "") {
    const v = getVal(c, key);
    const a = `data-did="${id}" data-f="${esc(key)}" ${S.canEdit ? "" : "disabled"}`;

  // ---------- Import ----------
  const ALIAS = {
    name: ["name", "kontakt", "vollständiger name", "vor- und nachname"],
    soziotop: ["soziotop", "soziotope", "umfeld", "kreis"],
    beruf: ["beruf", "job", "tätigkeit", "position"],
    info: ["informationen", "information", "info", "infos", "notizen", "notiz", "bemerkung", "bemerkungen"],
    nextStep: ["next step", "nextstep", "next steps", "nächster schritt", "naechster schritt"],
    nextDate: ["fällig", "fällig am", "datum", "termin", "next step datum"],
    pp: ["pp"],
    _service: ["service-termin", "service termin", "servicetermin", "letzter service"],
    _serviceNext: ["nächster service", "naechster service"],
  };
  function splitRows(text) {
    text = text.replace(/^﻿/, "");
    const first = text.split(/\r?\n/)[0] || "";
    const d = first.includes("\t") ? "\t" : (first.split(";").length > first.split(",").length ? ";" : ",");
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"' && cur === "") q = true;
      else if (ch === d) { row.push(cur); cur = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
      else cur += ch;
    }
    if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
    return rows.filter((r) => r.some((x) => x.trim()));
  }
  function parseImport(text) {
    const out = { rows: [], mapped: [], newFields: [], noName: 0, hasLists: false };
    if (!text.trim()) return out;
    const all = splitRows(text);
    if (all.length < 2) return out;
    const norm = (s) => s.toLowerCase().replace(/\s+/g, " ").trim();
    const cols = all[0].map((h) => h.trim()).map((h) => {
      const n = norm(h);
      if (n === "vorname") return { kind: "first", h };
      if (n === "nachname") return { kind: "last", h };
      if (n === "listen") return { kind: "lists", h };
      for (const [k, al] of Object.entries(ALIAS)) if (al.includes(n)) return { kind: "base", key: k, h };
      const ex = S.fields.find((f) => norm(f.label) === n);
      if (ex) return { kind: "custom", id: ex.id, h };
      return h ? { kind: "new", h } : { kind: "skip", h };
    });
    out.mapped = cols.filter((c) => c.kind !== "new" && c.kind !== "skip").map((c) => c.h);
    out.newFields = cols.filter((c) => c.kind === "new").map((c) => c.h);
    out.hasLists = cols.some((c) => c.kind === "lists");
    for (const r of all.slice(1)) {
      const o = { custom: {}, newVals: {}, lists: [] }; let first = "", last = "";
      cols.forEach((c, i) => {
        const v = (r[i] || "").trim(); if (!v) return;
        if (c.kind === "base" && c.key.startsWith("_")) o.custom[c.key] = toIsoDate(v);
        else if (c.kind === "base") o[c.key] = c.key === "nextDate" ? toIsoDate(v) : v;
        else if (c.kind === "first") first = v;
        else if (c.kind === "last") last = v;
        else if (c.kind === "lists") o.lists = v.split(",").map((s) => LISTS.find((l) => norm(l.label) === norm(s) || norm(l.short) === norm(s))).filter(Boolean).map((l) => l.id);
        else if (c.kind === "custom") o.custom[c.id] = v;
        else if (c.kind === "new") o.newVals[c.h] = v;
      });
      if (o.custom._service && !o.custom._serviceNext) o.custom._serviceNext = plusMonths(o.custom._service, 6);
      if (!o.name && (first || last)) o.name = [first, last].filter(Boolean).join(" ");
      if (!o.name) { out.noName++; continue; }
      out.rows.push(o);
    }
    return out;
  }
  function toIsoDate(v) {
    const m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
    if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; }
    return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : "";
  }
  async function runImport() {
    const p = parseImport(importText);
    if (!p.rows.length) return;
    const listId = $("impList").value;
    $("impGo").disabled = true;
    const newIds = {};
    if (p.newFields.length) {
      for (const h of p.newFields) { const f = { id: uid8(), label: h, type: "text", lists: null }; S.fields.push(f); newIds[h] = f.id; }
      saveSettings();
    }
    const batch = p.rows.map((r) => {
      const custom = { ...r.custom };
      for (const [h, v] of Object.entries(r.newVals)) custom[newIds[h]] = v;
      const c = { ...blank(r.lists.length ? r.lists : [listId]), ...r, custom, lists: r.lists.length ? r.lists : [listId] };
      delete c.newVals;
      return [newId(), c];
    });
    let done = 0;
    for (let i = 0; i < batch.length; i += 200) {
      const chunk = batch.slice(i, i + 200);
      const { error } = await S.sb.from("contacts").insert(chunk.map(([id, c]) => toRow(id, c)));
      if (error) { reportError(error); break; }
      for (const [id, c] of chunk) putContact(id, c);
      done += chunk.length;
      const st = $("impStatus"); if (st) st.textContent = `${done} von ${batch.length} gespeichert …`;

    importText = "";
    S.list = listId;
    closePanel();

  }

  // ---------- Kalender ----------
  function icsText(s) { return String(s || "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/[,;]/g, (m) => "\\" + m); }
  function icsFold(line) { const out = []; while (line.length > 74) { out.push(line.slice(0, 74)); line = " " + line.slice(74); } out.push(line); return out.join("\r\n"); }
  function addToCalendar(id) {
    const c = S.contacts.get(id); if (!c) return;
    if (!c.nextDate) { toast("Trag zuerst bei „Fällig am“ ein Datum ein."); return; }
    const time = ($("calTime") && S.openId === id && $("calTime").value) || "";
    const dur = Number(($("calDur") && S.openId === id && $("calDur").value) || 60);
    const d = c.nextDate.replace(/-/g, "");
    const pad = (n) => String(n).padStart(2, "0");
    const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    let when;
    if (time) {
      const [h, m] = time.split(":").map(Number);
      const start = new Date(c.nextDate + "T00:00:00"); start.setHours(h, m);
      const end = new Date(start.getTime() + dur * 60000);
      const f = (x) => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
      when = [`DTSTART:${f(start)}`, `DTEND:${f(end)}`, "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Erinnerung", "TRIGGER:-PT30M", "END:VALARM"];
    } else {
      const next = new Date(c.nextDate + "T12:00:00"); next.setDate(next.getDate() + 1);
      when = [`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${next.getFullYear()}${pad(next.getMonth() + 1)}${pad(next.getDate())}`, "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Erinnerung", "TRIGGER:PT9H", "END:VALARM"];
    }
    const title = (c.nextStep ? c.nextStep + " – " : "Next Step – ") + (c.name || "Kontakt");
    const desc = [c.beruf && "Beruf: " + c.beruf, c.soziotop && "Soziotop: " + c.soziotop, c.info].filter(Boolean).join("\n");
    const valarmAt = when.indexOf("BEGIN:VALARM");
    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Kontakt-Dashboard//DE", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
      `UID:${id}-${d}@kontakt-dashboard`, `DTSTAMP:${stamp}`, ...when.slice(0, valarmAt),
      `SUMMARY:${icsText(title)}`, desc ? `DESCRIPTION:${icsText(desc)}` : null, ...when.slice(valarmAt), "END:VEVENT", "END:VCALENDAR"].filter(Boolean);
    const ics = lines.map(icsFold).join("\r\n") + "\r\n";
    const a = document.createElement("a");
    a.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
    a.download = `${(c.name || "termin").replace(/[^\wäöüÄÖÜß-]+/g, "-")}-${c.nextDate}.ics`;
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------- Export ----------
  function exportCsv() {
    const rows = visibleRows(), custom = fieldsFor(S.list);
    const svcCols = S.list === "kunden";
    const head = ["Name", "Soziotop", "Beruf", "Informationen", "Next Step", "Fällig am", ...(svcCols ? ["Service-Termin", "Nächster Service"] : []), ...custom.map((f) => f.label), "Listen"];
    const q = (v) => { const s = v === true ? "ja" : v === false || v == null ? "" : String(v); return /[";\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const lines = [head.map(q).join(";")].concat(rows.map((c) => [c.name, c.soziotop, c.beruf, c.info, c.nextStep, c.nextDate, ...(svcCols ? [(c.custom || {})._service, (c.custom || {})._serviceNext] : []), ...custom.map((f) => (c.custom || {})[f.id]), c.lists.map((l) => listById(l).label).join(", ")].map(q).join(";")));
    const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
